<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Automata YT</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg: #000000; --surface: #0a0a0a; --border: #1a1a1a;
    --accent: #ff4d00; --accent-hover: #ff6a2b; --text: #ffffff; --muted: #666;
    --ease-smooth: cubic-bezier(0.165, 0.84, 0.44, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 24px; min-height: 100vh; }

  /* LOGIN */
  .auth-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; transition: 0.4s var(--ease-smooth); }
  .auth-overlay.hidden { opacity: 0; pointer-events: none; }
  .auth-card { background: var(--surface); border: 1px solid var(--accent); padding: 40px; border-radius: 30px; width: 350px; text-align: center; }
  .auth-input { width: 100%; padding: 15px; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 50px; margin-bottom: 20px; text-align: center; outline: none; font-family: 'Space Mono', monospace; }
  .auth-btn { width: 100%; padding: 15px; background: var(--accent); color: #000; border: none; border-radius: 50px; font-weight: 800; cursor: pointer; transition: 0.2s; }

  /* HEADER */
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 20px; }
  .logo-container { display: flex; align-items: center; gap: 12px; }
  .logo-text { font-size: 1.6rem; font-weight: 800; letter-spacing: -1px; }
  
  .header-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .drop-wrapper { position: relative; }
  
  .bubble-btn {
    background: var(--surface); border: 1px solid var(--border); color: #fff; 
    padding: 10px 22px; border-radius: 50px; cursor: pointer; font-size: 0.85rem; font-weight: 600;
    transition: 0.2s var(--ease-smooth); display: flex; align-items: center; gap: 8px;
  }
  .bubble-btn:hover { border-color: var(--accent); }

  .drop-menu {
    position: absolute; top: 50px; right: 0; background: #0a0a0a; border: 1px solid var(--accent);
    border-radius: 20px; width: 250px; padding: 12px; display: none; z-index: 100; flex-direction: column; gap: 4px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.8);
  }
  .drop-menu.open { display: flex; }
  .drop-opt { display: flex; align-items: center; gap: 10px; padding: 10px; cursor: pointer; border-radius: 12px; font-size: 0.85rem; transition: 0.2s; }
  .drop-opt:hover { background: rgba(255,77,0,0.1); }
  .drop-opt.selected { color: var(--accent); font-weight: 700; background: rgba(255,77,0,0.05); }

  /* DASHBOARD */
  .totals { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 30px; }
  .total-card { background: var(--surface); border: 1px solid var(--border); border-radius: 25px; padding: 30px; position: relative; overflow: hidden; }
  .total-card .value { font-size: 3rem; font-weight: 900; color: var(--accent); letter-spacing: -2px; line-height: 1; }
  .total-card .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; font-weight: 700; letter-spacing: 1px; }

  .chart-container { background: var(--surface); border: 1px solid var(--border); border-radius: 25px; padding: 20px; margin-bottom: 30px; height: 380px; }

  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 25px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th { padding: 18px 24px; text-align: left; font-size: 0.7rem; color: var(--muted); text-transform: uppercase; border-bottom: 1px solid var(--border); letter-spacing: 1px; }
  td { padding: 18px 24px; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
  .row-chan { display: flex; align-items: center; gap: 12px; font-weight: 700; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: #111; object-fit: cover; border: 1px solid var(--border); }

  /* SIDEBAR */
  .sidebar { position: fixed; top: 0; right: -400px; width: 350px; height: 100vh; background: #000; border-left: 1px solid var(--accent); transition: 0.4s var(--ease-smooth); z-index: 200; padding: 25px; }
  .sidebar.open { right: 0; }
  .side-card { background: var(--surface); padding: 16px; border-radius: 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); }

  .custom-date-box { display: none; padding: 12px; border-top: 1px solid var(--border); flex-direction: column; gap: 8px; }
  .custom-date-box.open { display: flex; }
  .date-picker { background: #000; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 12px; font-size: 0.8rem; color-scheme: dark; outline: none; font-family: 'Space Mono', monospace; }

  /* RESPONSIVIDADE */
  @media (max-width: 768px) {
    body { padding: 16px; }
    header { justify-content: center; }
    .header-controls { justify-content: center; width: 100%; }
    .totals { grid-template-columns: 1fr; gap: 16px; }
    .total-card .value { font-size: 2.2rem; }
    .chart-container { height: 300px; }
    .logo-container { width: 100%; justify-content: center; margin-bottom: 10px; }
    .sidebar { width: 100%; right: -100%; }
  }
</style>
</head>
<body>

<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <div style="display:flex; justify-content:center; margin-bottom: 24px;">
      <svg width="60" height="60" viewBox="0 0 100 100">
        <rect x="10" y="10" width="80" height="80" rx="20" stroke="#ff4d00" stroke-width="4" fill="none" />
        <rect x="35" y="32" width="10" height="10" fill="#ff4d00" rx="1" />
        <rect x="35" y="45" width="10" height="10" fill="#ff4d00" rx="1" />
        <rect x="35" y="58" width="10" height="10" fill="#ff4d00" rx="1" />
        <rect x="48" y="38.5" width="10" height="10" fill="#ff4d00" rx="1" />
        <rect x="48" y="51.5" width="10" height="10" fill="#ff4d00" rx="1" />
        <rect x="61" y="45" width="10" height="10" fill="#ff4d00" rx="1" />
      </svg>
    </div>
    <input type="password" id="passwordInput" class="auth-input" placeholder="Senha Mestra">
    <button class="auth-btn" onclick="login()">ABRIR DASHBOARD</button>
  </div>
</div>

<div id="appContent" style="display:none">
  <header>
    <div class="logo-container">
      <svg width="36" height="36" viewBox="0 0 100 100">
        <rect x="10" y="10" width="80" height="80" rx="20" stroke="#ff4d00" stroke-width="6" fill="none" />
        <rect x="35" y="32" width="10" height="10" fill="#ff4d00" rx="1" />
        <rect x="35" y="45" width="10" height="10" fill="#ff4d00" rx="1" />
        <rect x="35" y="58" width="10" height="10" fill="#ff4d00" rx="1" />
        <rect x="48" y="38.5" width="10" height="10" fill="#ff4d00" rx="1" />
        <rect x="48" y="51.5" width="10" height="10" fill="#ff4d00" rx="1" />
        <rect x="61" y="45" width="10" height="10" fill="#ff4d00" rx="1" />
      </svg>
      <div class="logo-text">Automata</div>
    </div>
    
    <div class="header-controls">
      <div class="drop-wrapper">
        <button class="bubble-btn" id="btnCanais" onclick="toggleDrop('dropCanais')">Canais ▾</button>
        <div class="drop-menu" id="dropCanais"></div>
      </div>

      <div class="drop-wrapper">
        <button class="bubble-btn" id="btnPeriodo" onclick="toggleDrop('dropDatas')">28 Dias ▾</button>
        <div class="drop-menu" id="dropDatas" style="right: auto; left: 0;">
          <div class="drop-opt" id="opt1" onclick="setPreset(1)">Último Dia</div>
          <div class="drop-opt" id="opt7" onclick="setPreset(7)">Últimos 7 Dias</div>
          <div class="drop-opt selected" id="opt28" onclick="setPreset(28)">Últimos 28 Dias</div>
          <div class="drop-opt" id="opt90" onclick="setPreset(90)">Últimos 90 Dias</div>
          <div style="height:1px; background:var(--border); margin:5px 0;"></div>
          <div id="monthOptions"></div> 
          <div style="height:1px; background:var(--border); margin:5px 0;"></div>
          <div class="drop-opt" onclick="toggleCustomDate()">Data Específica</div>
          <div class="custom-date-box" id="customDateBox">
            <input type="date" id="dateStart" class="date-picker">
            <input type="date" id="dateEnd" class="date-picker" style="margin-top:5px">
            <button class="auth-btn" onclick="applyCustom()" style="padding:8px; margin-top:8px; font-size:0.75rem">Aplicar</button>
          </div>
        </div>
      </div>

      <button class="bubble-btn" onclick="document.getElementById('sidebar').classList.add('open')" style="padding: 10px 15px;">⋮</button>
    </div>
  </header>

  <div class="totals">
    <div class="total-card"><div class="label" id="labelRevenue">Receita do Período</div><div class="value" id="totalRevenue">$0.00</div></div>
    <div class="total-card"><div class="label" id="labelViews">Views do Período</div><div class="value" id="totalViews">0</div></div>
  </div>

  <div class="chart-container"><canvas id="mainChart"></canvas></div>

  <div class="table-wrap">
    <table>
      <thead><tr><th>Canal</th><th>Receita (USD)</th><th>Views</th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<div class="sidebar" id="sidebar">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px">
    <h2 style="font-size:1.2rem; font-weight:800">Canais Conectados</h2>
    <button class="bubble-btn" onclick="document.getElementById('sidebar').classList.remove('open')" style="border:none">✕</button>
  </div>
  <div id="sidebarContent"></div>
</div>

<script>
const CHANNELS = [
  { id: 'UC_RatoFIT', name: 'RatoFIT' }, { id: 'UC_ZeroHora', name: 'Zero Hora' },
  { id: 'UC_VelozCuriosos', name: 'Velozes & Curiosos' }, { id: 'UC_ComptonKings', name: 'Compton Kings' },
  { id: 'UC_Pixelando', name: 'Pixelando 165' }, { id: 'UC_McQueeeen', name: 'McQueeeen' },
  { id: 'UC_RatoMaromba', name: 'Rato Maromba' }, { id: 'UC_GroveStreet', name: 'Grove Street Style' },
  { id: 'UC_BerserkMode', name: 'Berserk Mode' }, { id: 'UC_OnePunchFights', name: 'One Punch Fights' },
  { id: 'UC_UltimoPeao', name: 'O Último Peão' }, { id: 'UC_EcosDaMente', name: 'Ecos da Mente' }
];

const CHANNEL_IDS = {
  'UC_RatoFIT': 'UCR61DCrMZx-g3irgqgoT5JA', 'UC_ZeroHora': 'UC6sh-Qiz2gj_uqUdYfYnX6w',
  'UC_VelozCuriosos': 'UCXMwjsceXKA5dqbWSWE-_7Q', 'UC_ComptonKings': 'UCGqLCGdh5xUJiQW416DQWjA',
  'UC_Pixelando': 'UCzE6ujftVmVmEvGJW0MArlw', 'UC_McQueeeen': 'UCMNvTCr-RwLVRW-jDIQVnBw',
  'UC_RatoMaromba': 'UCxslmo0asWXgdWObPO8BFrQ', 'UC_GroveStreet': 'UChQfM3wIfo84Ab0WeW9CwCA',
  'UC_BerserkMode': 'UCzkne80zh104CdG3kDrTQ1w', 'UC_OnePunchFights': 'UChdMYJwcBpizC4NLh5dRh4g',
  'UC_UltimoPeao': 'UCkdnxxobb7NvO6EX2kLqv4A', 'UC_EcosDaMente': 'UCpCEVQUoScH3SNPZjEcAWpg',
};

let accounts = {}, results = {}, thumbs = {}, activePeriod = 28, myChart = null;
let selectedChannels = new Set(CHANNELS.map(c => c.id));

async function login() {
  const pwd = document.getElementById('passwordInput').value;
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pwd }) });
  if (r.ok) { document.getElementById('authOverlay').classList.add('hidden'); document.getElementById('appContent').style.display='block'; initApp(); }
}

async function initApp() {
  await loadAccounts();
  await loadThumbs();
  renderCanais();
  renderMeses();
  renderSidebar();
  initChart();
  fetchAll();
}

async function loadAccounts() { try { const r = await fetch('/api/accounts'); accounts = await r.json(); } catch(e){} }
async function loadThumbs() {
  const ids = Object.values(CHANNEL_IDS).join(',');
  const r = await fetch('/api/channel-thumbs?ids=' + ids);
  const data = await r.json();
  if(data.ok) Object.keys(CHANNEL_IDS).forEach(key => { thumbs[key] = data.thumbs[CHANNEL_IDS[key]]; });
}

function toggleDrop(id) {
  const el = document.getElementById(id);
  const isO = el.classList.contains('open');
  document.querySelectorAll('.drop-menu').forEach(d => d.classList.remove('open'));
  if(!isO) el.classList.add('open');
}

function renderCanais() {
  const drop = document.getElementById('dropCanais'); drop.innerHTML = '';
  CHANNELS.forEach(ch => {
    const isS = selectedChannels.has(ch.id);
    const div = document.createElement('div');
    div.className = `drop-opt ${isS ? 'selected' : ''}`;
    div.innerHTML = `<img src="${thumbs[ch.id] || ''}" class="avatar"> <span>${ch.name}</span>`;
    div.onclick = (e) => { e.stopPropagation(); if(isS) { if(selectedChannels.size > 1) selectedChannels.delete(ch.id); } else selectedChannels.add(ch.id); renderCanais(); updateUI(); };
    drop.appendChild(div);
  });
  document.getElementById('btnCanais').innerText = selectedChannels.size === CHANNELS.length ? 'Todos os Canais ▾' : `${selectedChannels.size} Canais ▾`;
}

function renderMeses() {
  const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
  const container = document.getElementById('monthOptions'); container.innerHTML = '';
  const d = new Date();
  for(let i=0; i<3; i++) {
    const m = new Date(d.getFullYear(), d.getMonth() - i, 1);
    const opt = document.createElement('div');
    opt.className = 'drop-opt';
    opt.innerText = monthNames[m.getMonth()];
    opt.onclick = () => {
      const first = new Date(m.getFullYear(), m.getMonth(), 1).toISOString().split('T')[0];
      const last = new Date(m.getFullYear(), m.getMonth() + 1, 0).toISOString().split('T')[0];
      document.getElementById('dateStart').value = first;
      document.getElementById('dateEnd').value = last;
      applyCustom(monthNames[m.getMonth()]);
    };
    container.appendChild(opt);
  }
}

function setPreset(days) {
  activePeriod = days;
  document.querySelectorAll('.drop-opt').forEach(el => el.classList.remove('selected'));
  document.getElementById('opt' + days).classList.add('selected');
  document.getElementById('btnPeriodo').innerText = (days === 1 ? 'Último Dia' : days + ' Dias') + ' ▾';
  document.getElementById('customDateBox').classList.remove('open');
  document.getElementById('dropDatas').classList.remove('open');
  fetchAll();
}

function toggleCustomDate() { document.getElementById('customDateBox').classList.toggle('open'); }

function applyCustom(label) {
  activePeriod = 'custom';
  document.getElementById('btnPeriodo').innerText = (label || 'Personalizado') + ' ▾';
  document.getElementById('dropDatas').classList.remove('open');
  fetchAll();
}

async function fetchAll() {
  let start, end = new Date().toISOString().split('T')[0];
  
  if(activePeriod === 'custom') {
    start = document.getElementById('dateStart').value;
    end = document.getElementById('dateEnd').value;
  } else if(activePeriod === 1) {
    // MÁGICA: Se for Último Dia, pede 5 dias para garimpar qual o mais recente com dados
    const d = new Date(); d.setDate(d.getDate() - 5);
    start = d.toISOString().split('T')[0];
  } else {
    const d = new Date(); d.setDate(d.getDate() - activePeriod);
    start = d.toISOString().split('T')[0];
  }

  const promises = CHANNELS.map(ch => fetchChannel(ch, start, end));
  await Promise.all(promises);
  updateUI();
}

async function fetchChannel(ch, start, end) {
  try {
    const r = await fetch(`/api/analytics?channelId=${CHANNEL_IDS[ch.id]}&startDate=${start}&endDate=${end}`);
    const data = await r.json();
    results[ch.id] = data.ok ? data.rows : [];
  } catch(e) { results[ch.id] = []; }
}

function updateUI() {
  const tbody = document.getElementById('tableBody'); tbody.innerHTML = '';
  let tR = 0, tV = 0, dD = {};

  // Descobrir a última data real com receita se for "Último Dia"
  let maxDate = null;
  if(activePeriod === 1) {
    let allDates = [];
    Object.values(results).forEach(rows => {
      // Pega apenas dias que tem receita > 0
      rows.forEach(r => { if(r[1] > 0) allDates.push(r[0]); });
    });
    // Pega a data mais recente da lista filtrada
    maxDate = allDates.length ? allDates.sort().reverse()[0] : null;
    
    // Atualiza o label para mostrar a data exata
    const displayDate = maxDate ? maxDate.split('-').reverse().join('/') : 'Aguardando...';
    document.getElementById('labelRevenue').innerText = 'Receita em ' + displayDate;
    document.getElementById('labelViews').innerText = 'Views em ' + displayDate;
  } else {
    document.getElementById('labelRevenue').innerText = 'Receita do Período';
    document.getElementById('labelViews').innerText = 'Views do Período';
  }

  CHANNELS.forEach(ch => {
    if(!selectedChannels.has(ch.id)) return;
    let rows = results[ch.id] || [];
    
    // Se for "Último Dia", filtra apenas pela data máxima encontrada com receita
    if(activePeriod === 1) {
      rows = rows.filter(r => r[0] === maxDate);
    }

    const rS = rows.reduce((a, b) => a + b[1], 0);
    const vS = rows.reduce((a, b) => a + b[2], 0);
    tR += rS; tV += vS;
    
    rows.forEach(r => dD[r[0]] = (dD[r[0]] || 0) + r[1]);
    
    tbody.innerHTML += `<tr><td><div class="row-chan"><img src="${thumbs[ch.id]}" class="avatar">${ch.name}</div></td><td style="color:var(--accent);font-weight:800">$${rS.toFixed(2)}</td><td style="font-weight:600">${vS.toLocaleString()}</td></tr>`;
  });

  document.getElementById('totalRevenue').innerText = `$${tR.toFixed(2)}`;
  document.getElementById('totalViews').innerText = tV.toLocaleString();
  updateChart(dD);
}

function renderSidebar() {
  const content = document.getElementById('sidebarContent'); content.innerHTML = '';
  CHANNELS.forEach(ch => {
    const isC = !!accounts[ch.id];
    content.innerHTML += `<div class="side-card">
      <div style="display:flex;align-items:center;gap:15px">
        <img src="${thumbs[ch.id] || ''}" class="avatar" style="width:36px; height:36px">
        <div><b>${ch.name}</b><br><small style="color:${isC?'#00ff00':'#666'}">${isC ? 'ONLINE' : 'PENDENTE'}</small></div>
      </div>
      <a href="/auth/${ch.id}" class="bubble-btn" style="text-decoration:none; padding:8px 16px; background:${isC?'transparent':'var(--accent)'}; color:${isC?'#fff':'#000'}">${isC ? 'ATUALIZAR' : 'VINCULAR'}</a>
    </div>`;
  });
}

function initChart() {
  const ctx = document.getElementById('mainChart').getContext('2d');
  myChart = new Chart(ctx, {
    type: 'line',
    data: { labels: [], datasets: [{ label: 'Receita', data: [], borderColor: '#ff4d00', tension: 0.4, fill: true, backgroundColor: 'rgba(255, 77, 0, 0.05)', borderWidth: 3, pointRadius: 3, pointBackgroundColor: '#ff4d00' }] },
    options: { 
      responsive: true, maintainAspectRatio: false, 
      plugins: { legend: { display: false }, tooltip: { backgroundColor: '#0a0a0a', borderColor: '#ff4d00', borderWidth: 1, titleFont: { size: 14 }, bodyFont: { size: 14 }, padding: 12 } }, 
      scales: { y: { grid: { color: '#111' }, ticks: { color: '#666', font: { family: 'Space Mono' } } }, x: { grid: { display: false }, ticks: { color: '#666', font: { family: 'Space Mono' } } } } 
    }
  });
}

function updateChart(dailyData) {
  const sorted = Object.keys(dailyData).sort();
  myChart.data.labels = sorted.map(d => d.split('-').reverse().slice(0,2).join('/'));
  myChart.data.datasets[0].data = sorted.map(d => dailyData[d]);
  myChart.update();
}

document.addEventListener('click', (e) => {
  if(!e.target.closest('.drop-wrapper')) document.querySelectorAll('.drop-menu').forEach(d => d.classList.remove('open'));
});
</script>
</body>
</html>
