<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard YT Automata</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg: #000000;         /* Preto absoluto */
    --surface: #0f0f0f;    /* Fundo dos cards (cinza muito escuro) */
    --border: #222222;
    --accent: #ff4d00;     /* Laranja vibrante */
    --accent-hover: #ff6a2b;
    --text: #ffffff;
    --muted: #888888;
  }
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 24px; min-height: 100vh; overflow-x: hidden; }
  
  /* SCROLLBAR CUSTOMIZADA */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  /* TELA DE LOGIN */
  .auth-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; transition: opacity 0.3s; }
  .auth-overlay.hidden { opacity: 0; pointer-events: none; }
  .auth-card { background: var(--surface); border: 1px solid var(--accent); padding: 40px; border-radius: 24px; width: 360px; text-align: center; box-shadow: 0 10px 40px rgba(255, 77, 0, 0.15); }
  .auth-card h2 { margin-bottom: 24px; font-weight: 700; font-size: 1.4rem; }
  .auth-card h2 span { color: var(--accent); }
  .auth-input { width: 100%; padding: 14px 16px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 50px; margin-bottom: 16px; font-size: 1rem; transition: 0.2s; text-align: center; }
  .auth-input:focus { border-color: var(--accent); outline: none; }
  .auth-btn { width: 100%; padding: 14px; background: var(--accent); color: #fff; border: none; border-radius: 50px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.2s; }
  .auth-btn:hover { background: var(--accent-hover); transform: scale(1.02); }
  .auth-error { color: var(--accent); font-size: 0.85rem; margin-top: 12px; display: none; }

  /* HEADER */
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
  .logo { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
  .logo-icon { width: 32px; height: 32px; background: var(--accent); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #000; font-weight: 800; font-size: 1.2rem;}
  
  .header-controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  
  /* ESTILO BUBBLE / BALÕES PARA BOTÕES */
  .bubble-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text); 
    padding: 10px 20px; border-radius: 50px; cursor: pointer; font-size: 0.85rem; 
    font-weight: 500; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex; align-items: center; gap: 8px;
  }
  .bubble-btn:hover { border-color: var(--accent); background: rgba(255, 77, 0, 0.05); }
  .bubble-btn.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 700; }

  /* FILTRO DE CANAIS (NOVO) */
  .filter-wrapper { position: relative; }
  .filter-dropdown {
    position: absolute; top: calc(100% + 12px); left: 0; background: var(--surface);
    border: 1px solid var(--border); border-radius: 20px; padding: 16px;
    width: 280px; opacity: 0; pointer-events: none;
    transform: translateY(-10px) scale(0.95); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 50; display: flex; flex-direction: column; gap: 8px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.8); max-height: 400px; overflow-y: auto;
  }
  .filter-dropdown.open { opacity: 1; pointer-events: all; transform: translateY(0) scale(1); }
  
  .filter-option { 
    display: flex; align-items: center; gap: 12px; cursor: pointer; 
    padding: 8px 12px; border-radius: 12px; transition: 0.2s; border: 1px solid transparent;
  }
  .filter-option:hover { background: rgba(255, 77, 0, 0.05); border-color: var(--border); }
  .filter-option.selected { background: rgba(255, 77, 0, 0.1); border-color: var(--accent); }
  
  .avatar { 
    width: 32px; height: 32px; border-radius: 50%; background: var(--bg); border: 1px solid var(--accent); 
    color: var(--accent); display: flex; align-items: center; justify-content: center; 
    font-weight: 700; font-size: 0.75rem; letter-spacing: 0.5px;
  }
  .filter-option.selected .avatar { background: var(--accent); color: #000; }
  
  .channel-name-txt { font-size: 0.85rem; font-weight: 500; flex: 1; }
  .checkbox { width: 18px; height: 18px; border: 2px solid var(--muted); border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
  .filter-option.selected .checkbox { border-color: var(--accent); background: var(--accent); }
  .filter-option.selected .checkbox::after { content: '✓'; color: #000; font-size: 12px; font-weight: 900; }

  /* DATAS */
  .date-inputs { display: flex; gap: 8px; align-items: center; }
  .date-picker { 
    background: transparent; border: 1px solid var(--border); color: var(--text); 
    padding: 10px 16px; border-radius: 50px; color-scheme: dark; font-size: 0.8rem; 
    font-family: 'Inter', sans-serif; cursor: pointer; transition: 0.2s;
  }
  .date-picker:focus { border-color: var(--accent); outline: none; }

  /* DASHBOARD MAIN */
  .totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 24px; margin-bottom: 24px; }
  .total-card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 32px; display: flex; flex-direction: column; justify-content: center; }
  .total-card .label { font-size: 0.85rem; color: var(--muted); font-weight: 500; margin-bottom: 8px; }
  .total-card .value { font-size: 3rem; font-weight: 800; letter-spacing: -1.5px; }
  .total-card.revenue .value { color: var(--accent); }

  .chart-container { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 24px; margin-bottom: 32px; height: 350px; width: 100%; }
  .status-msg { font-family: 'Space Mono', monospace; font-size: 0.75rem; color: var(--muted); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }

  /* TABELA */
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; overflow: hidden; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 600px; }
  th { background: rgba(255,255,255,0.02); padding: 16px 24px; text-align: left; font-size: 0.75rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
  td { padding: 16px 24px; border-bottom: 1px solid var(--border); font-size: 0.9rem; transition: background 0.2s; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  tr:last-child td { border-bottom: none; }
  
  .table-channel { display: flex; align-items: center; gap: 12px; font-weight: 600; }
  .revenue-cell { color: var(--text); font-family: 'Space Mono', monospace; font-weight: 700; }
  .views-cell { color: var(--muted); font-family: 'Space Mono', monospace; }
  
  .badge { display: inline-flex; align-items: center; padding: 6px 12px; border-radius: 50px; font-size: 0.7rem; font-weight: 700; border: 1px solid transparent; }
  .badge.ok { border-color: var(--accent); color: var(--accent); background: rgba(255, 77, 0, 0.05); }
  .badge.error { border-color: #ef4444; color: #ef4444; background: rgba(239, 68, 68, 0.05); }
  .badge.loading { border-color: var(--muted); color: var(--text); }

  /* SIDEBAR DE CONEXÕES */
  .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 99; opacity: 0; pointer-events: none; transition: 0.3s; }
  .sidebar-overlay.open { opacity: 1; pointer-events: all; }
  .sidebar { position: fixed; top: 0; right: -400px; width: 380px; height: 100vh; background: var(--surface); border-left: 1px solid var(--accent); z-index: 100; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1); display: flex; flex-direction: column; }
  .sidebar.open { right: 0; }
  .sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 24px; border-bottom: 1px solid var(--border); }
  .sidebar-content { padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .channel-link-card { display: flex; align-items: center; justify-content: space-between; padding: 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 16px; }
  .btn-link { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 8px 16px; border-radius: 50px; font-size: 0.75rem; font-weight: 700; text-decoration: none; transition: 0.2s; }
  .btn-link:hover { background: var(--accent); color: #000; }
  .btn-link.linked { border-color: var(--border); color: var(--muted); }
  .btn-link.linked:hover { border-color: var(--accent); color: var(--accent); background: transparent; }
</style>
</head>
<body>

<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <h2>Automata<span>.</span></h2>
    <input type="password" id="passwordInput" class="auth-input" placeholder="Senha Mestra">
    <button class="auth-btn" onclick="login()">Acessar Cofre</button>
    <div class="auth-error" id="authError">Senha incorreta.</div>
  </div>
</div>

<div id="appContent" style="display: none;">
  <header>
    <div class="logo">
      <div class="logo-icon">A</div>
      Automata
    </div>
    <div class="header-controls">
      
      <div class="filter-wrapper">
        <button class="bubble-btn" id="btnFilter" onclick="toggleFilterDropdown()">
          Filtrar Canais ▾
        </button>
        <div class="filter-dropdown" id="filterDropdown">
          </div>
      </div>

      <button class="bubble-btn active period-btn" data-days="7">7 Dias</button>
      <button class="bubble-btn period-btn" data-days="30">30 Dias</button>
      <button class="bubble-btn period-btn" data-days="90">90 Dias</button>
      
      <div class="date-inputs">
        <input type="date" id="dateStart" class="date-picker">
        <input type="date" id="dateEnd" class="date-picker">
      </div>

      <button class="bubble-btn" onclick="toggleSidebar()" style="padding: 10px 14px;" title="Vincular Contas">⋮</button>
    </div>
  </header>

  <div class="totals">
    <div class="total-card revenue">
      <div class="label">Receita Filtrada (USD)</div>
      <div class="value" id="totalRevenue">$0.00</div>
    </div>
    <div class="total-card views">
      <div class="label">Visualizações Filtradas</div>
      <div class="value" id="totalViews">0</div>
    </div>
  </div>

  <div class="chart-container">
    <canvas id="mainChart"></canvas>
  </div>

  <p class="status-msg" id="statusMsg"><div class="status-dot"></div> Aguardando...</p>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Canal</th><th>Receita (USD)</th><th>Views</th><th>Status</th></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2 style="font-size: 1.2rem; font-weight: 700;">Vincular Contas</h2>
      <button class="bubble-btn" onclick="toggleSidebar()" style="padding: 6px 12px; border:none">✕</button>
    </div>
    <div class="sidebar-content" id="sidebarContent"></div>
  </div>
</div>

<script>
const CHANNELS = [
  { id: 'UC_RatoFIT', name: 'RatoFIT' }, { id: 'UC_ZeroHora', name: 'Zero Hora' },
  { id: 'UC_VelozCuriosos', name: 'Velozes & Curiosos' }, { id: 'UC_ComptonKings', name: 'Compton Kings' },
  { id: 'UC_Pixelando', name: 'Pixelando 165' }, { id: 'UC_McQueeeen', name: 'McQueeeen' },
  { id: 'UC_RatoMaromba', name: 'Rato Maromba' }, { id: 'UC_GroveStreet', name: 'Grove Street Style' },
  { id: 'UC_BerserkMode', name: 'Berserk Mode' }, { id: 'UC_OnePunchFights', name: 'One Punch Fights' },
  { id: 'UC_UltimoPeao', name: 'O Último Peão' }, { id: 'UC_EcosDaMente', name: 'Ecos da Mente' }
];

const CHANNEL_IDS = {
  'UC_RatoFIT': 'UCR61DCrMZx-g3irgqgoT5JA', 'UC_ZeroHora': 'UC6sh-Qiz2gj_uqUdYfYnX6w',
  'UC_VelozCuriosos': 'UCXMwjsceXKA5dqbWSWE-_7Q', 'UC_ComptonKings': 'UCGqLCGdh5xUJiQW416DQWjA',
  'UC_Pixelando': 'UCzE6ujftVmVmEvGJW0MArlw', 'UC_McQueeeen': 'UCMNvTCr-RwLVRW-jDIQVnBw',
  'UC_RatoMaromba': 'UCxslmo0asWXgdWObPO8BFrQ', 'UC_GroveStreet': 'UChQfM3wIfo84Ab0WeW9CwCA',
  'UC_BerserkMode': 'UCzkne80zh104CdG3kDrTQ1w', 'UC_OnePunchFights': 'UChdMYJwcBpizC4NLh5dRh4g',
  'UC_UltimoPeao': 'UCkdnxxobb7NvO6EX2kLqv4A', 'UC_EcosDaMente': 'UCpCEVQUoScH3SNPZjEcAWpg',
};

let accounts = {}, results = {}, activeDays = 7, myChart = null;

// Lógica do Filtro de Canais
let selectedChannels = new Set(CHANNELS.map(c => c.id)); // Todos selecionados por padrão

function toggleFilterDropdown() {
  document.getElementById('filterDropdown').classList.toggle('open');
}

function renderFilterDropdown() {
  const drop = document.getElementById('filterDropdown');
  drop.innerHTML = '';
  
  CHANNELS.forEach(ch => {
    const isSel = selectedChannels.has(ch.id);
    const initials = ch.name.substring(0,2).toUpperCase();
    
    drop.innerHTML += `
      <div class="filter-option ${isSel ? 'selected' : ''}" onclick="toggleChannelSelection('${ch.id}')">
        <div class="avatar">${initials}</div>
        <span class="channel-name-txt">${ch.name}</span>
        <div class="checkbox"></div>
      </div>
    `;
  });

  const btnText = selectedChannels.size === CHANNELS.length ? 'Todos os Canais ▾' : `${selectedChannels.size} Canais ▾`;
  document.getElementById('btnFilter').innerText = btnText;
  if(selectedChannels.size !== CHANNELS.length) document.getElementById('btnFilter').classList.add('active');
  else document.getElementById('btnFilter').classList.remove('active');
}

function toggleChannelSelection(id) {
  if(selectedChannels.has(id)) {
    if(selectedChannels.size > 1) selectedChannels.delete(id); // Impede de desmarcar todos
  } else {
    selectedChannels.add(id);
  }
  renderFilterDropdown();
  renderTable();
  renderTotals();
  updateChart();
}

// Fechar dropdown ao clicar fora
document.addEventListener('click', (e) => {
  if(!e.target.closest('.filter-wrapper')) {
    document.getElementById('filterDropdown').classList.remove('open');
  }
});

// Sistema de Login
async function checkAuthStatus() {
  try {
    const r = await fetch('/api/status');
    const data = await r.json();
    if (data.authenticated) {
      document.getElementById('authOverlay').classList.add('hidden');
      document.getElementById('appContent').style.display = 'block';
      initApp();
    }
  } catch(e) {}
}

async function login() {
  const pwd = document.getElementById('passwordInput').value;
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwd })
    });
    if (r.ok) {
      document.getElementById('authError').style.display = 'none';
      checkAuthStatus();
    } else {
      document.getElementById('authError').style.display = 'block';
    }
  } catch(e) { console.error('Login error', e); }
}

document.getElementById('passwordInput').addEventListener('keypress', function (e) {
  if (e.key === 'Enter') login();
});

checkAuthStatus();

async function initApp() {
  await loadAccounts();
  renderSidebar();
  renderFilterDropdown();
  initChart();
  renderTable(); 
  
  if (Object.keys(accounts).length > 0) fetchAll();
  else setStatus('Nenhuma conta vinculada. Abra o menu lateral (⋮) para conectar.');
}

async function loadAccounts() {
  try { const r = await fetch('/api/accounts'); accounts = await r.json(); } catch { accounts = {}; }
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('open');
}

function renderSidebar() {
  const content = document.getElementById('sidebarContent');
  content.innerHTML = '';
  CHANNELS.forEach(ch => {
    const isConn = !!accounts[ch.id];
    content.innerHTML += `
      <div class="channel-link-card">
        <div>
          <h4 style="font-size:0.85rem; margin-bottom:4px">${ch.name}</h4>
          <span style="font-size:0.7rem; color:var(--muted)">${isConn ? '🟢 Conectado' : '⚪ Pendente'}</span>
        </div>
        <a href="/auth/${ch.id}" class="btn-link ${isConn ? 'linked' : ''}">${isConn ? 'Atualizar' : 'Vincular'}</a>
      </div>`;
  });
}

function setStatus(msg) { document.getElementById('statusMsg').innerHTML = `<div class="status-dot"></div> ${msg}`; }

const periodBtns = document.querySelectorAll('.period-btn');
const dateStartInput = document.getElementById('dateStart');
const dateEndInput = document.getElementById('dateEnd');

periodBtns.forEach(btn => {
  btn.onclick = () => {
    periodBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeDays = parseInt(btn.dataset.days);
    dateStartInput.value = ''; dateEndInput.value = '';
    fetchAll();
  };
});

[dateStartInput, dateEndInput].forEach(input => {
  input.addEventListener('change', () => {
    periodBtns.forEach(b => b.classList.remove('active'));
    activeDays = 'custom';
    if (dateStartInput.value && dateEndInput.value) fetchAll();
  });
});

function getYTDate(daysAgo) {
  const d = new Date(); d.setDate(d.getDate() - daysAgo);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

async function fetchAll() {
  if (Object.keys(accounts).length === 0) return;
  let start, end;

  if (activeDays === 'custom') {
    start = dateStartInput.value; end = dateEndInput.value;
  } else {
    // Solução Inteligente do Delay: Pede até "Hoje" (0). O YT retorna o último dia disponível (ex: dia 12).
    end = getYTDate(0); 
    start = getYTDate(activeDays); 
  }

  setStatus('Sincronizando dados com o Google...');
  CHANNELS.forEach(ch => { results[ch.id] = { status: 'loading', rows: [] }; });
  renderTable();

  const promises = CHANNELS.map(ch => fetchChannel(ch, start, end));
  await Promise.all(promises);

  setStatus(`Dados de ${start.split('-').reverse().join('/')} até os relatórios mais recentes`);
  renderTable(); renderTotals(); updateChart();
}

async function fetchChannel(ch, start, end) {
  try {
    const r = await fetch(`/api/analytics?channelId=${CHANNEL_IDS[ch.id]}&startDate=${start}&endDate=${end}`);
    const data = await r.json();
    results[ch.id] = data.ok ? { status: 'ok', rows: data.rows || [] } : { status: 'error', rows: [] };
  } catch { results[ch.id] = { status: 'error', rows: [] }; }
}

function renderTable() {
  const tbody = document.getElementById('tableBody'); tbody.innerHTML = '';
  
  CHANNELS.forEach((ch) => {
    if(!selectedChannels.has(ch.id)) return; // Esconde se não estiver no filtro

    const r = results[ch.id] || { status: 'pending', rows: [] };
    let rev = 0, views = 0;
    if (r.rows && r.rows.length > 0) {
      rev = r.rows.reduce((sum, row) => sum + row[1], 0);
      views = r.rows.reduce((sum, row) => sum + row[2], 0);
    }
    
    let badge = '<span class="badge pending">Pendente</span>';
    if (r.status === 'loading') badge = '<span class="badge loading">Buscando...</span>';
    else if (r.status === 'ok') badge = '<span class="badge ok">Ativo</span>';
    else if (r.status === 'error') badge = '<span class="badge error">Sem Acesso</span>';

    const initials = ch.name.substring(0,2).toUpperCase();

    tbody.innerHTML += `
      <tr>
        <td>
          <div class="table-channel">
            <div class="avatar" style="width:28px; height:28px; font-size:0.65rem">${initials}</div>
            ${ch.name}
          </div>
        </td>
        <td class="revenue-cell">${r.status === 'ok' ? '$'+rev.toFixed(2) : '—'}</td>
        <td class="views-cell">${r.status === 'ok' ? views.toLocaleString('pt-BR') : '—'}</td>
        <td>${badge}</td>
      </tr>`;
  });
}

function renderTotals() {
  let totalR = 0, totalV = 0;
  CHANNELS.forEach(ch => {
    if(!selectedChannels.has(ch.id)) return; // Soma apenas os selecionados

    const r = results[ch.id];
    if (r && r.status === 'ok' && r.rows) {
      totalR += r.rows.reduce((sum, row) => sum + row[1], 0);
      totalV += r.rows.reduce((sum, row) => sum + row[2], 0);
    }
  });
  document.getElementById('totalRevenue').textContent = `$${totalR.toFixed(2)}`;
  document.getElementById('totalViews').textContent = totalV.toLocaleString('pt-BR');
}

function initChart() {
  const ctx = document.getElementById('mainChart').getContext('2d');
  Chart.defaults.color = '#888888'; Chart.defaults.font.family = 'Inter';
  
  myChart = new Chart(ctx, {
    type: 'line',
    data: { 
      labels: [], 
      datasets: [{ 
        label: 'Receita (USD)', 
        data: [], 
        borderColor: '#ff4d00', 
        borderWidth: 3, 
        pointBackgroundColor: '#000', 
        pointBorderColor: '#ff4d00', 
        pointBorderWidth: 2, 
        pointRadius: 4, 
        pointHoverRadius: 6, 
        tension: 0.4, 
        fill: true, 
        backgroundColor: 'rgba(255, 77, 0, 0.1)' 
      }] 
    },
    options: { 
      responsive: true, maintainAspectRatio: false, 
      plugins: { 
        legend: { display: false }, 
        tooltip: { backgroundColor: '#111', titleFont: { family: 'Space Mono', size: 13 }, bodyFont: { family: 'Space Mono', size: 14, weight: 'bold' }, padding: 12, borderColor: '#ff4d00', borderWidth: 1, displayColors: false, callbacks: { label: function(context) { return '$' + context.parsed.y.toFixed(2); } } } 
      }, 
      scales: { 
        y: { beginAtZero: true, grid: { color: '#222', drawBorder: false }, border: { dash: [4, 4] }, ticks: { font: { family: 'Space Mono' }, callback: function(value) { return '$' + value; } } }, 
        x: { grid: { display: false, drawBorder: false }, ticks: { font: { family: 'Space Mono' } } } 
      } 
    }
  });
}

function updateChart() {
  const dailyData = {};
  CHANNELS.forEach(ch => {
    if(!selectedChannels.has(ch.id)) return; // Gráfico apenas com os selecionados

    const r = results[ch.id];
    if (r && r.status === 'ok' && r.rows) r.rows.forEach(row => dailyData[row[0]] = (dailyData[row[0]] || 0) + row[1]);
  });
  
  const sortedDates = Object.keys(dailyData).sort();
  if (sortedDates.length === 0) { myChart.data.labels = []; myChart.data.datasets[0].data = []; }
  else if (sortedDates.length === 1) {
    myChart.config.type = 'bar'; myChart.data.datasets[0].backgroundColor = 'rgba(255, 77, 0, 0.8)'; myChart.data.datasets[0].borderRadius = 50;
    myChart.data.labels = [sortedDates[0].split('-').slice(1).reverse().join('/')]; myChart.data.datasets[0].data = [dailyData[sortedDates[0]]];
  } else {
    myChart.config.type = 'line'; myChart.data.datasets[0].backgroundColor = 'rgba(255, 77, 0, 0.1)';
    myChart.data.labels = sortedDates.map(d => d.split('-').slice(1).reverse().join('/')); myChart.data.datasets[0].data = sortedDates.map(d => dailyData[d]);
  }
  myChart.update();
}
</script>
</body>
</html>
