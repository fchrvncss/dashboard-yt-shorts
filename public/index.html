<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Automata YT</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg: #000000; --surface: #0a0a0a; --border: #1a1a1a;
    --accent: #ff4d00; --accent-hover: #ff6a2b; --text: #ffffff; --muted: #666;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 24px; min-height: 100vh; }

  /* LOGIN */
  .auth-overlay { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; align-items: center; justify-content: center; }
  .auth-overlay.hidden { display: none; }
  .auth-card { background: var(--surface); border: 1px solid var(--accent); padding: 40px; border-radius: 30px; width: 350px; text-align: center; }
  .auth-input { width: 100%; padding: 15px; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 50px; margin-bottom: 20px; text-align: center; }
  .auth-btn { width: 100%; padding: 15px; background: var(--accent); color: #000; border: none; border-radius: 50px; font-weight: 800; cursor: pointer; }

  /* UI BUBBLE */
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  .logo { font-size: 1.6rem; font-weight: 800; letter-spacing: -1px; }
  .logo span { color: var(--accent); }

  .bubble-btn {
    background: var(--surface); border: 1px solid var(--border); color: #fff; 
    padding: 10px 22px; border-radius: 50px; cursor: pointer; font-size: 0.85rem; font-weight: 600;
    transition: 0.2s;
  }
  .bubble-btn:hover { border-color: var(--accent); }
  .bubble-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

  .date-picker { background: #000; border: 1px solid var(--border); color: #fff; padding: 10px 15px; border-radius: 50px; font-size: 0.8rem; color-scheme: dark; }

  .totals { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
  .total-card { background: var(--surface); border: 1px solid var(--border); border-radius: 30px; padding: 30px; }
  .total-card .value { font-size: 3rem; font-weight: 900; letter-spacing: -2px; color: var(--accent); }
  .total-card .label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; font-weight: 700; margin-bottom: 5px; }

  .chart-container { background: var(--surface); border: 1px solid var(--border); border-radius: 30px; padding: 25px; margin-bottom: 40px; height: 350px; }

  /* FILTRO DROP */
  .filter-wrapper { position: relative; }
  .filter-drop {
    position: absolute; top: 50px; left: 0; background: #0a0a0a; border: 1px solid var(--accent);
    border-radius: 20px; width: 280px; padding: 15px; display: none; z-index: 100; flex-direction: column; gap: 8px;
    box-shadow: 0 10px 30px rgba(255,77,0,0.2);
  }
  .filter-drop.open { display: flex; }
  .channel-opt { display: flex; align-items: center; gap: 12px; padding: 10px; cursor: pointer; border-radius: 12px; transition: 0.2s; }
  .channel-opt:hover { background: rgba(255,77,0,0.1); }
  .channel-opt.selected { background: rgba(255,77,0,0.2); }
  
  .avatar { width: 35px; height: 35px; border-radius: 50%; background: #222; object-fit: cover; border: 1px solid var(--border); }
  .channel-opt.selected .avatar { border-color: var(--accent); }

  /* TABELA */
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 30px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th { padding: 20px; text-align: left; font-size: 0.75rem; color: var(--muted); text-transform: uppercase; border-bottom: 1px solid var(--border); }
  td { padding: 18px 20px; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
  .row-chan { display: flex; align-items: center; gap: 15px; font-weight: 700; }

  /* SIDEBAR */
  .sidebar { position: fixed; top: 0; right: -400px; width: 350px; height: 100vh; background: #000; border-left: 1px solid var(--accent); transition: 0.3s; z-index: 200; padding: 30px; }
  .sidebar.open { right: 0; }
  .side-card { background: var(--surface); padding: 15px; border-radius: 20px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); }
</style>
</head>
<body>

<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <h2 style="margin-bottom:20px">Automata<span>.</span></h2>
    <input type="password" id="passwordInput" class="auth-input" placeholder="Senha Mestra">
    <button class="auth-btn" onclick="login()">ACESSAR</button>
  </div>
</div>

<div id="appContent" style="display:none">
  <header>
    <div class="logo">Automata<span>.</span></div>
    <div style="display:flex; gap:12px; align-items:center">
      <div class="filter-wrapper">
        <button class="bubble-btn" onclick="document.getElementById('filterDrop').classList.toggle('open')">Filtrar Canais ▾</button>
        <div class="filter-drop" id="filterDrop"></div>
      </div>
      <button class="bubble-btn active p-btn" data-days="1">Último Dia</button>
      <button class="bubble-btn p-btn" data-days="7">7 Dias</button>
      <button class="bubble-btn p-btn" data-days="30">30 Dias</button>
      <input type="date" id="dateStart" class="date-picker">
      <input type="date" id="dateEnd" class="date-picker">
      <button class="bubble-btn" onclick="document.getElementById('sidebar').classList.add('open')">⋮</button>
    </div>
  </header>

  <div class="totals">
    <div class="total-card"><div class="label">Receita</div><div class="value" id="totalRevenue">$0.00</div></div>
    <div class="total-card"><div class="label">Views</div><div class="value" id="totalViews">0</div></div>
  </div>

  <div class="chart-container"><canvas id="mainChart"></canvas></div>

  <div class="table-wrap">
    <table>
      <thead><tr><th>Canal</th><th>Receita (USD)</th><th>Views</th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<div class="sidebar" id="sidebar">
  <button class="bubble-btn" onclick="document.getElementById('sidebar').classList.remove('open')" style="margin-bottom:20px">FECHAR ✕</button>
  <div id="sidebarContent"></div>
</div>

<script>
const CHANNELS = [
  { id: 'UC_RatoFIT', name: 'RatoFIT' }, { id: 'UC_ZeroHora', name: 'Zero Hora' },
  { id: 'UC_VelozCuriosos', name: 'Velozes & Curiosos' }, { id: 'UC_ComptonKings', name: 'Compton Kings' },
  { id: 'UC_Pixelando', name: 'Pixelando 165' }, { id: 'UC_McQueeeen', name: 'McQueeeen' },
  { id: 'UC_RatoMaromba', name: 'Rato Maromba' }, { id: 'UC_GroveStreet', name: 'Grove Street Style' },
  { id: 'UC_BerserkMode', name: 'Berserk Mode' }, { id: 'UC_OnePunchFights', name: 'One Punch Fights' },
  { id: 'UC_UltimoPeao', name: 'O Último Peão' }, { id: 'UC_EcosDaMente', name: 'Ecos da Mente' }
];

const CHANNEL_IDS = {
  'UC_RatoFIT': 'UCR61DCrMZx-g3irgqgoT5JA', 'UC_ZeroHora': 'UC6sh-Qiz2gj_uqUdYfYnX6w',
  'UC_VelozCuriosos': 'UCXMwjsceXKA5dqbWSWE-_7Q', 'UC_ComptonKings': 'UCGqLCGdh5xUJiQW416DQWjA',
  'UC_Pixelando': 'UCzE6ujftVmVmEvGJW0MArlw', 'UC_McQueeeen': 'UCMNvTCr-RwLVRW-jDIQVnBw',
  'UC_RatoMaromba': 'UCxslmo0asWXgdWObPO8BFrQ', 'UC_GroveStreet': 'UChQfM3wIfo84Ab0WeW9CwCA',
  'UC_BerserkMode': 'UCzkne80zh104CdG3kDrTQ1w', 'UC_OnePunchFights': 'UChdMYJwcBpizC4NLh5dRh4g',
  'UC_UltimoPeao': 'UCkdnxxobb7NvO6EX2kLqv4A', 'UC_EcosDaMente': 'UCpCEVQUoScH3SNPZjEcAWpg',
};

let accounts = {}, results = {}, thumbs = {}, activeDays = 1, myChart = null;
let selectedChannels = new Set(CHANNELS.map(c => c.id));

async function login() {
  const pwd = document.getElementById('passwordInput').value;
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pwd }) });
  if (r.ok) { document.getElementById('authOverlay').classList.add('hidden'); document.getElementById('appContent').style.display='block'; initApp(); }
}

async function initApp() {
  await loadAccounts();
  await loadThumbs();
  renderFilters();
  renderSidebar();
  initChart();
  if (Object.keys(accounts).length > 0) fetchAll();
}

async function loadAccounts() { try { const r = await fetch('/api/accounts'); accounts = await r.json(); } catch(e){} }

async function loadThumbs() {
  const ids = Object.values(CHANNEL_IDS).join(',');
  const r = await fetch('/api/channel-thumbs?ids=' + ids);
  const data = await r.json();
  if(data.ok) {
    Object.keys(CHANNEL_IDS).forEach(key => { thumbs[key] = data.thumbs[CHANNEL_IDS[key]]; });
  }
}

function renderFilters() {
  const drop = document.getElementById('filterDrop'); drop.innerHTML = '';
  CHANNELS.forEach(ch => {
    const isSel = selectedChannels.has(ch.id);
    const div = document.createElement('div');
    div.className = `channel-opt ${isSel ? 'selected' : ''}`;
    div.innerHTML = `<img src="${thumbs[ch.id] || ''}" class="avatar"> <span>${ch.name}</span>`;
    div.onclick = () => { if(selectedChannels.has(ch.id)) selectedChannels.delete(ch.id); else selectedChannels.add(ch.id); renderFilters(); updateUI(); };
    drop.appendChild(div);
  });
}

function renderSidebar() {
  const content = document.getElementById('sidebarContent'); content.innerHTML = '';
  CHANNELS.forEach(ch => {
    const isConn = !!accounts[ch.id];
    content.innerHTML += `<div class="side-card"><div><b>${ch.name}</b><br><small>${isConn ? 'Conectado' : 'Pendente'}</small></div><a href="/auth/${ch.id}" class="bubble-btn" style="text-decoration:none">${isConn ? 'Atualizar' : 'Vincular'}</a></div>`;
  });
}

document.querySelectorAll('.p-btn').forEach(btn => {
  btn.onclick = () => { document.querySelectorAll('.p-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); activeDays = parseInt(btn.dataset.days); fetchAll(); };
});

async function fetchAll() {
  const start = getYTDate(activeDays === 1 ? 5 : activeDays + 2); // Busca margem maior para garimpar o dia 12
  const end = getYTDate(0);
  
  const promises = CHANNELS.map(ch => fetchChannel(ch, start, end));
  await Promise.all(promises);
  updateUI();
}

async function fetchChannel(ch, start, end) {
  try {
    const r = await fetch(`/api/analytics?channelId=${CHANNEL_IDS[ch.id]}&startDate=${start}&endDate=${end}`);
    const data = await r.json();
    results[ch.id] = data.ok ? data.rows : [];
  } catch(e) { results[ch.id] = []; }
}

function updateUI() {
  const tbody = document.getElementById('tableBody'); tbody.innerHTML = '';
  let totalR = 0, totalV = 0, dailyData = {};

  // MÁGICA: Encontrar o ÚLTIMO dia absoluto com dados de qualquer canal
  let allDates = [];
  Object.values(results).forEach(rows => rows.forEach(r => allDates.push(r[0])));
  const maxDate = allDates.length ? allDates.sort().reverse()[0] : null;

  CHANNELS.forEach(ch => {
    if(!selectedChannels.has(ch.id)) return;
    let rows = results[ch.id] || [];
    
    // Se for "Último Dia", filtra apenas pela data máxima encontrada
    if(activeDays === 1 && maxDate) rows = rows.filter(r => r[0] === maxDate);

    const rSum = rows.reduce((a, b) => a + b[1], 0);
    const vSum = rows.reduce((a, b) => a + b[2], 0);
    totalR += rSum; totalV += vSum;

    rows.forEach(r => { dailyData[r[0]] = (dailyData[r[0]] || 0) + r[1]; });

    tbody.innerHTML += `<tr><td><div class="row-chan"><img src="${thumbs[ch.id]}" class="avatar">${ch.name}</div></td><td class="revenue-cell">$${rSum.toFixed(2)}</td><td>${vSum.toLocaleString()}</td></tr>`;
  });

  document.getElementById('totalRevenue').innerText = `$${totalR.toFixed(2)}`;
  document.getElementById('totalViews').innerText = totalV.toLocaleString();
  
  updateChart(dailyData);
}

function getYTDate(daysAgo) {
  const d = new Date(); d.setDate(d.getDate() - daysAgo);
  return d.toISOString().split('T')[0];
}

function initChart() {
  const ctx = document.getElementById('mainChart').getContext('2d');
  myChart = new Chart(ctx, {
    type: 'line',
    data: { labels: [], datasets: [{ label: 'Receita', data: [], borderColor: '#ff4d00', tension: 0.4, fill: true, backgroundColor: 'rgba(255, 77, 0, 0.05)' }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { grid: { color: '#111' } }, x: { grid: { display: false } } } }
  });
}

function updateChart(dailyData) {
  const sorted = Object.keys(dailyData).sort();
  myChart.data.labels = sorted.map(d => d.split('-').reverse().slice(0,2).join('/'));
  myChart.data.datasets[0].data = sorted.map(d => dailyData[d]);
  myChart.update();
}
</script>
</body>
</html>
