<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Automata YT</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='80' height='80' rx='20' stroke='%23ff4d00' stroke-width='6' fill='none'/><rect x='35' y='32' width='10' height='10' fill='%23ff4d00'/><rect x='35' y='45' width='10' height='10' fill='%23ff4d00'/><rect x='35' y='58' width='10' height='10' fill='%23ff4d00'/><rect x='48' y='38.5' width='10' height='10' fill='%23ff4d00'/><rect x='48' y='51.5' width='10' height='10' fill='%23ff4d00'/><rect x='61' y='45' width='10' height='10' fill='%23ff4d00'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{
  --bg:#000;--s1:#080808;--s2:#0f0f0f;--s3:#141414;
  --border:#1c1c1c;--border2:#242424;
  --accent:#ff4d00;--accent-dim:rgba(255,77,0,0.12);--accent-glow:rgba(255,77,0,0.06);
  --text:#fff;--t2:#aaa;--t3:#555;
  --ease:cubic-bezier(0.16,1,0.3,1);
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow-x:hidden;}
body{padding:24px;}
body.no-scroll{overflow:hidden;}
img{display:block;}
button{font-family:'Inter',sans-serif;}

/* ── HEADER ── */
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border);}
.logo{display:flex;align-items:center;gap:10px;font-size:1.4rem;font-weight:800;letter-spacing:-0.5px;}
.hcontrols{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

/* ── PILL BUTTONS ── */
.pill{background:var(--s2);border:1px solid var(--border);color:var(--text);padding:0 16px;border-radius:50px;cursor:pointer;font-size:0.78rem;font-weight:600;height:36px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:border-color 0.2s,background 0.2s;}
.pill:hover{border-color:var(--accent);background:var(--accent-glow);}
.pill.active-accent{border-color:var(--accent);color:var(--accent);}

/* ── CLEAR BTN ── */
.filter-group{display:flex;align-items:center;}
.clear-x{background:var(--s2);border:1px solid var(--border);border-right:none;height:36px;color:var(--text);display:flex;align-items:center;justify-content:center;border-radius:50px 0 0 50px;cursor:pointer;width:0;opacity:0;overflow:hidden;white-space:nowrap;font-size:0.9rem;font-weight:700;pointer-events:none;transition:all 0.3s var(--ease);}
.clear-x.on{width:40px;opacity:1;pointer-events:auto;}
.clear-x.on:hover{width:150px;background:var(--accent);border-color:var(--accent);color:#000;}
.clear-x span{font-size:0.7rem;opacity:0;width:0;transition:0.25s;overflow:hidden;}
.clear-x.on:hover span{opacity:1;width:auto;margin-left:8px;}
.clear-x.on+.drop-wrap .pill{border-radius:0 50px 50px 0;border-left-color:transparent;}

/* ── DROPDOWNS ── */
.drop-wrap{position:relative;}
.drop-menu{position:absolute;top:42px;right:0;background:#0c0c0c;border:1px solid var(--accent);border-radius:18px;width:250px;padding:10px;display:none;z-index:200;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,0.95);max-height:380px;overflow-y:auto;scrollbar-width:none;}
.drop-menu.open{display:flex;}
.dopt{display:flex;align-items:center;gap:10px;padding:10px 11px;cursor:pointer;border-radius:10px;font-size:0.82rem;color:var(--t2);transition:background 0.15s,color 0.15s,transform 0.2s var(--ease);}
.dopt:hover{background:var(--accent-dim);color:#ff9d66;transform:scale(1.02);}
.dopt.sel{color:var(--accent);font-weight:700;background:var(--accent-glow);}
.apply-btn{background:transparent;color:var(--accent);border:1px solid var(--accent);padding:10px;border-radius:10px;font-weight:700;font-size:0.72rem;cursor:pointer;margin-top:8px;position:sticky;bottom:0;width:100%;text-transform:uppercase;transition:0.2s;}
.apply-btn:hover{background:var(--accent);color:#000;}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#111;}

/* ── TOTALS ── */
.totals{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;margin-bottom:20px;align-items:stretch;}
.tcard-combined{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);display:grid;grid-template-columns:1fr 1fr;overflow:visible;transition:border-color 0.2s;grid-column:span 2;}
.tcard-combined.has-active{border-color:var(--accent);}
.tcard-half{padding:20px 22px;cursor:pointer;user-select:none;transition:background 0.18s;border-right:1px solid var(--border);}
.tcard-half:first-child{border-radius:var(--r) 0 0 var(--r);}
.tcard-half:last-child{border-right:none;flex:1;}
.tcard-half:hover{background:rgba(255,77,0,0.04);}
.tcard-half.active{background:var(--accent-glow);}
/* clip hover background to card corners */
.tcard-half:first-child:hover,.tcard-half:first-child.active{border-radius:var(--r) 0 0 var(--r);}
.pct-wrap .tcard-half:hover,.pct-wrap .tcard-half.active{border-radius:0 var(--r) var(--r) 0;}
.tcard{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:20px 22px;transition:border-color 0.2s,transform 0.2s var(--ease);cursor:pointer;user-select:none;}
.tcard:hover{border-color:rgba(255,77,0,0.4);transform:translateY(-2px);}
.tcard.active{border-color:var(--accent);background:var(--accent-glow);}
.tcard-l{font-size:0.6rem;color:var(--t3);text-transform:uppercase;letter-spacing:1.2px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.tcard-v{font-size:2rem;font-weight:900;color:var(--accent);letter-spacing:-1px;line-height:1;}
.tcard-sub{font-size:0.58rem;color:var(--t3);margin-top:4px;}

/* PARTIAL DROPDOWN */
.pct-wrap{position:relative;display:flex;flex-direction:column;}
.pct-drop{position:absolute;top:calc(100% + 8px);left:0;width:320px;background:#0a0a0a;border:1px solid var(--accent);border-radius:16px;padding:14px;z-index:400;flex-direction:column;gap:0;box-shadow:0 12px 40px rgba(0,0,0,0.95);display:none;}
.pct-drop.open{display:flex;}
.pct-drop-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;}
.pct-title{font-size:0.72rem;font-weight:800;color:var(--text);}
.pct-close-btn{background:transparent;border:1px solid var(--border);color:var(--t3);width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:0.62rem;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
.pct-close-btn:hover{border-color:var(--accent);color:var(--accent);}

/* ALTERADO: Controla a altura máxima do popup para disparar o scroll vertical */
.pct-list{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;max-height:230px;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}

/* ALTERADO: flex-shrink: 0 garante que as opções fiquem rígidas e sólidas, sem achatar */
.pct-item{display:flex;flex-direction:column;border-radius:9px;border:1px solid var(--border);overflow:hidden;transition:border-color 0.15s;background:transparent;flex-shrink:0;}

.pct-item:hover {border-color:rgba(255,77,0,0.3);}
.pct-item.active-pct{border-color:var(--accent);background:var(--accent-glow);}
.pct-item.dragging{opacity:0.35;transform:scale(0.97);}
.pct-item.drag-over{border-color:var(--accent);border-style:dashed;background:rgba(255,77,0,0.04);}
.pct-item-row{display:flex;align-items:center;cursor:pointer;}
.pct-item-drag{padding:0 7px;color:var(--t3);font-size:0.65rem;cursor:grab;opacity:0;transition:opacity 0.15s;user-select:none;}
.pct-item:hover .pct-item-drag{opacity:0.6;}
.pct-item-main{flex:1;padding:8px 10px;display:flex;align-items:center;gap:7px;}
.pct-item-pct{font-size:0.85rem;font-weight:800;color:var(--accent);}
.pct-item-default{font-size:0.46rem;background:var(--accent);color:#000;padding:1px 5px;border-radius:4px;font-weight:800;margin-left:auto;}
.pct-item-actions{display:flex;align-items:stretch;width:0;overflow:hidden;transition:width 0.22s var(--ease);}
.pct-item:hover .pct-item-actions{border-left:1px solid var(--border);}
.pct-item:not(.is-default):hover .pct-item-actions{width:120px;}
.pct-item.is-default:hover .pct-item-actions{width:80px;}
.pct-action-btn{padding:0 7px;background:transparent;border:none;color:var(--t3);cursor:pointer;font-size:0.52rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:color 0.12s,background 0.12s;white-space:nowrap;min-height:38px;}
.pct-action-btn:hover{color:var(--accent);background:rgba(255,77,0,0.08);}
.pct-action-btn+.pct-action-btn{border-left:1px solid var(--border);}
.pct-action-btn .ab-icon{font-size:0.68rem;}
.pct-edit-area{display:none;padding:6px 8px;border-top:1px solid var(--border);}
.pct-edit-area.show{display:flex;gap:5px;align-items:center;}
.pct-edit-input{flex:1;padding:5px 8px;border-radius:7px;border:1px solid var(--accent);background:#000;color:var(--text);font-size:0.85rem;font-weight:700;outline:none;text-align:center;-moz-appearance:textfield;appearance:textfield;}
.pct-edit-input::-webkit-inner-spin-button,.pct-edit-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
.pct-edit-ok{padding:5px 10px;border-radius:7px;background:var(--accent);color:#000;border:none;font-weight:800;font-size:0.7rem;cursor:pointer;}
.pct-edit-cancel{padding:5px 8px;border-radius:7px;background:transparent;border:1px solid var(--border);color:var(--t3);font-size:0.7rem;cursor:pointer;}
.pct-add-btn{width:100%;padding:8px;border-radius:9px;background:#0a0a0a;border:1px dashed var(--border);color:var(--t3);font-size:0.7rem;font-weight:600;cursor:pointer;transition:all 0.18s;display:flex;align-items:center;justify-content:center;gap:5px;flex-shrink:0;position:relative;z-index:1;}
.pct-add-btn:hover{border-color:var(--accent);color:var(--accent);}
.pct-add-area{display:none;flex-direction:column;gap:6px;margin-top:8px;}
.pct-add-area.show{display:flex;}
.pct-input{padding:9px 14px;border-radius:9px;border:1px solid var(--border);background:#000;color:var(--text);font-size:1rem;font-weight:700;width:100%;outline:none;text-align:center;transition:border-color 0.18s;-moz-appearance:textfield;appearance:textfield;}
.pct-input::-webkit-inner-spin-button,.pct-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
.pct-input:focus{border-color:var(--accent);}
.pct-input-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.pct-confirm-btn{padding:8px;border-radius:9px;background:var(--accent);color:#000;border:none;font-weight:800;font-size:0.74rem;cursor:pointer;transition:opacity 0.15s;}
.pct-confirm-btn:hover{opacity:0.85;}
.pct-cancel-btn{padding:8px;border-radius:9px;background:transparent;border:1px solid var(--border);color:var(--t3);font-weight:700;font-size:0.74rem;cursor:pointer;transition:all 0.15s;}
.pct-cancel-btn:hover{border-color:var(--accent);color:var(--accent);}

/* ── MAIN CHART ── */
.main-chart-wrap{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px 10px;margin-bottom:20px;height:260px;}

/* ── TABLE ── */
.table-wrap{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:0;}
table{width:100%;border-collapse:collapse;}
th{padding:12px 16px;text-align:left;font-size:0.6rem;color:var(--t3);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--border);font-weight:600;}
td{padding:14px 16px;border-bottom:1px solid var(--border);font-size:0.88rem;vertical-align:middle;}
.channel-row{cursor:pointer;}
.channel-row td{transition:background 0.12s;}
.channel-row:hover td{background:rgba(255,77,0,0.04);}
.chan-cell{display:flex;align-items:center;gap:10px;font-weight
