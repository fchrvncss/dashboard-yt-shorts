<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard YT Shorts Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg: #0a0a0a; --surface: #111111; --border: #222222;
    --accent: #ff4d00; --accent2: #ffcc00; --text: #f0f0f0;
    --muted: #555; --green: #00e676; --red: #ff1744;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; padding: 32px 24px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 20px; flex-wrap: wrap; gap: 16px; }
  .logo { font-size: 1.4rem; font-weight: 800; }
  .logo span { color: var(--accent); }
  
  .period-selector { display: flex; gap: 8px; align-items: center; }
  .period-btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 6px 14px; border-radius: 4px; cursor: pointer; font-family: 'Space Mono', monospace; font-size: 0.75rem; }
  .period-btn.active { border-color: var(--accent); color: var(--accent); }
  
  .date-inputs { display: flex; gap: 8px; margin-left: 8px; border-left: 1px solid var(--border); padding-left: 16px; }
  .date-picker { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 5px; border-radius: 4px; color-scheme: dark; font-size: 0.75rem; }

  .chart-container { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 32px; height: 350px; }
  
  .accounts-bar { display: flex; gap: 12px; margin-bottom: 32px; flex-wrap: wrap; }
  .account-chip { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; cursor: pointer; flex: 1; min-width: 200px; }
  .account-chip.connected { border-color: var(--green); }
  .account-chip-header { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.85rem; margin-bottom: 4px; }
  .account-chip-channels { font-size: 0.7rem; color: var(--muted); font-family: 'Space Mono'; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .account-chip.connected .dot { background: var(--green); }

  .btn-fetch { background: var(--accent); color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; }
  
  .totals { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 32px; }
  .total-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .total-card .label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; font-family: 'Space Mono'; margin-bottom: 4px; }
  .total-card .value { font-size: 1.8rem; font-weight: 800; }
  .total-card.revenue .value { color: var(--accent2); }

  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { background: #161616; padding: 12px 20px; text-align: left; font-size: 0.65rem; color: var(--muted); font-family: 'Space Mono'; border-bottom: 1px solid var(--border); }
  td { padding: 14px 20px; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
  .channel-name { font-weight: 700; }
  .revenue-cell { color: var(--accent2); font-family: 'Space Mono'; }
  .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.65rem; font-family: 'Space Mono'; }
  .badge.ok { background: rgba(0,230,118,0.1); color: var(--green); }

  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); padding: 32px; border-radius: 12px; width: 400px; }
  .btn-primary { background: var(--accent); color: #fff; padding: 10px 20px; border-radius: 6px; text-decoration: none; display: inline-block; font-weight: 700; margin-top: 20px; }
</style>
</head>
<body>

<header>
  <div class="logo">YT<span>.</span>Dashboard</div>
  <div class="period-selector">
    <button class="period-btn active" data-days="1">Última Atualiz.</button>
    <button class="period-btn" data-days="7">7d</button>
    <button class="period-btn" data-days="30">30d</button>
    <div class="date-inputs">
      <input type="date" id="dateStart" class="date-picker">
      <input type="date" id="dateEnd" class="date-picker">
    </div>
  </div>
</header>

<div class="chart-container">
  <canvas id="mainChart"></canvas>
</div>

<div class="accounts-bar" id="accountsBar">
  <button class="btn-fetch" id="btnFetch" onclick="fetchAll()">▶ Buscar Dados</button>
</div>

<div class="totals">
  <div class="total-card revenue">
    <div class="label">Receita Acumulada</div>
    <div class="value" id="totalRevenue">$0.00</div>
  </div>
  <div class="total-card">
    <div class="label">Views Acumuladas</div>
    <div class="value" id="totalViews">0</div>
  </div>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr><th>Canal</th><th>Receita (USD)</th><th>Views</th><th>Status</th></tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">Conectar</h3>
    <p>Selecione todos os canais na tela do Google.</p>
    <a class="btn-primary" id="modalLink" href="#">Ir para o Google →</a>
    <button onclick="closeModal()" style="background:none; border:none; color:var(--muted); margin-left:15px; cursor:pointer;">Cancelar</button>
  </div>
</div>

<script>
const CHANNELS = [
  { id: 'UC_RatoFIT', name: 'RatoFIT', account: 1 },
  { id: 'UC_ZeroHora', name: 'Zero Hora', account: 1 },
  { id: 'UC_VelozCuriosos', name: 'Velozes & Curiosos', account: 1 },
  { id: 'UC_ComptonKings', name: 'Compton Kings', account: 1 },
  { id: 'UC_Pixelando', name: 'Pixelando 165', account: 2 },
  { id: 'UC_McQueeeen', name: 'McQueeeen', account: 2 },
  { id: 'UC_RatoMaromba', name: 'Rato Maromba', account: 2 },
  { id: 'UC_GroveStreet', name: 'Grove Street Style', account: 2 },
  { id: 'UC_BerserkMode', name: 'Berserk Mode', account: 2 },
  { id: 'UC_OnePunchFights', name: 'One Punch Fights', account: 3 },
  { id: 'UC_UltimoPeao', name: 'O Último Peão', account: 3 },
  { id: 'UC_EcosDaMente', name: 'Ecos da Mente', account: 3 },
];

const CHANNEL_IDS = {
  'UC_RatoFIT': 'UCR61DCrMZx-g3irgqgoT5JA', 'UC_ZeroHora': 'UC6sh-Qiz2gj_uqUdYfYnX6w',
  'UC_VelozCuriosos': 'UCXMwjsceXKA5dqbWSWE-_7Q', 'UC_ComptonKings': 'UCGqLCGdh5xUJiQW416DQWjA',
  'UC_Pixelando': 'UCzE6ujftVmVmEvGJW0MArlw', 'UC_McQueeeen': 'UCMNvTCr-RwLVRW-jDIQVnBw',
  'UC_RatoMaromba': 'UCxslmo0asWXgdWObPO8BFrQ', 'UC_GroveStreet': 'UChQfM3wIfo84Ab0WeW9CwCA',
  'UC_BerserkMode': 'UCzkne80zh104CdG3kDrTQ1w', 'UC_OnePunchFights': 'UChdMYJwcBpizC4NLh5dRh4g',
  'UC_UltimoPeao': 'UCkdnxxobb7NvO6EX2kLqv4A', 'UC_EcosDaMente': 'UCpCEVQUoScH3SNPZjEcAWpg',
};

let accounts = {}, results = {}, activeDays = 1, myChart = null;

async function init() {
  await loadAccounts();
  renderAccountsBar();
  initChart();
}

async function loadAccounts() {
  try { const r = await fetch('/api/accounts'); accounts = await r.json(); } catch { accounts = {}; }
}

function renderAccountsBar() {
  const bar = document.getElementById('accountsBar');
  const btn = document.getElementById('btnFetch');
  bar.innerHTML = '';
  const labels = { 1: 'Vini Team', 2: 'ApenasFischer', 3: 'FischerV2' };
  [1, 2, 3].forEach(slot => {
    const conn = !!accounts[slot];
    const chip = document.createElement('div');
    chip.className = 'account-chip' + (conn ? ' connected' : '');
    chip.innerHTML = `<div class="account-chip-header"><div class="dot"></div>${labels[slot]}</div>`;
    chip.onclick = () => { document.getElementById('modalLink').href=`/auth/${slot}`; document.getElementById('modalBg').classList.add('open'); };
    bar.appendChild(chip);
  });
  bar.appendChild(btn);
}

function closeModal() { document.getElementById('modalBg').classList.remove('open'); }

document.querySelectorAll('.period-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeDays = parseInt(btn.dataset.days);
  };
});

function getYTDate(daysAgo) {
  const d = new Date();
  d.setDate(d.getDate() - daysAgo);
  return d.toISOString().split('T')[0];
}

async function fetchAll() {
  // Ajuste do Delay de 2 dias: o "Hoje" real do YT é d-2
  const delay = 2;
  let start, end;

  if (document.getElementById('dateStart').value) {
    start = document.getElementById('dateStart').value;
    end = document.getElementById('dateEnd').value;
  } else {
    end = getYTDate(delay);
    start = getYTDate(activeDays + delay - 1);
  }

  document.getElementById('btnFetch').disabled = true;
  const promises = CHANNELS.map(ch => fetchChannel(ch, start, end));
  await Promise.all(promises);
  
  renderTable();
  updateChart();
  document.getElementById('btnFetch').disabled = false;
}

async function fetchChannel(ch, start, end) {
  try {
    const r = await fetch(`/api/analytics?channelId=${CHANNEL_IDS[ch.id]}&startDate=${start}&endDate=${end}`);
    const data = await r.json();
    results[ch.id] = data.ok ? data.rows : [];
  } catch { results[ch.id] = []; }
}

function renderTable() {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  let totalR = 0, totalV = 0;

  CHANNELS.forEach(ch => {
    const rows = results[ch.id] || [];
    const rev = rows.reduce((a, b) => a + b[1], 0);
    const views = rows.reduce((a, b) => a + b[2], 0);
    totalR += rev; totalV += views;

    tbody.innerHTML += `<tr>
      <td class="channel-name">${ch.name}</td>
      <td class="revenue-cell">$${rev.toFixed(2)}</td>
      <td>${views.toLocaleString()}</td>
      <td><span class="badge ok">ok</span></td>
    </tr>`;
  });

  document.getElementById('totalRevenue').textContent = `$${totalR.toFixed(2)}`;
  document.getElementById('totalViews').textContent = totalV.toLocaleString();
}

function initChart() {
  const ctx = document.getElementById('mainChart').getContext('2d');
  myChart = new Chart(ctx, {
    type: 'line',
    data: { labels: [], datasets: [{ label: 'Receita Total (USD)', data: [], borderColor: '#ff4d00', tension: 0.3, fill: true, backgroundColor: 'rgba(255, 77, 0, 0.1)' }] },
    options: { responsive: true, maintainAspectRatio: false, scales: { y: { grid: { color: '#222' } }, x: { grid: { display: false } } } }
  });
}

function updateChart() {
  const dailyData = {};
  Object.values(results).forEach(rows => {
    rows.forEach(row => {
      const date = row[0];
      dailyData[date] = (dailyData[date] || 0) + row[1];
    });
  });

  const sortedDates = Object.keys(dailyData).sort();
  myChart.data.labels = sortedDates.map(d => d.split('-').slice(1).reverse().join('/'));
  myChart.data.datasets[0].data = sortedDates.map(d => dailyData[d]);
  myChart.update();
}

init();
</script>
</body>
</html>
