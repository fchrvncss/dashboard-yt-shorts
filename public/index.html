<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Automata YT</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='80' height='80' rx='20' stroke='%23ff4d00' stroke-width='6' fill='none'/><rect x='35' y='32' width='10' height='10' fill='%23ff4d00'/><rect x='35' y='45' width='10' height='10' fill='%23ff4d00'/><rect x='35' y='58' width='10' height='10' fill='%23ff4d00'/><rect x='48' y='38.5' width='10' height='10' fill='%23ff4d00'/><rect x='48' y='51.5' width='10' height='10' fill='%23ff4d00'/><rect x='61' y='45' width='10' height='10' fill='%23ff4d00'/></svg>">

<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg: #000000; --surface: #0a0a0a; --border: #1a1a1a;
    --accent: #ff4d00; --accent-hover: #ff6a2b; --text: #ffffff; --muted: #666;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 24px; min-height: 100vh; overflow-x: hidden; }

  /* AUTH */
  .auth-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; }
  .auth-overlay.hidden { display: none; }
  .auth-card { background: var(--surface); border: 1px solid var(--accent); padding: 40px; border-radius: 30px; width: 320px; text-align: center; }
  .auth-input { width: 100%; padding: 15px; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 50px; margin-bottom: 20px; text-align: center; outline: none; font-family: 'Space Mono', monospace; }
  .auth-btn { width: 100%; padding: 15px; background: var(--accent); color: #000; border: none; border-radius: 50px; font-weight: 800; cursor: pointer; }

  /* HEADER */
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  .logo-container { display: flex; align-items: center; gap: 12px; }
  .logo-text { font-size: 1.5rem; font-weight: 800; letter-spacing: -1px; }
  .header-controls { display: flex; gap: 10px; }
  
  .bubble-btn {
    background: var(--surface); border: 1px solid var(--border); color: #fff; 
    padding: 10px 20px; border-radius: 50px; cursor: pointer; font-size: 0.8rem; font-weight: 600;
    transition: 0.2s; display: flex; align-items: center; gap: 6px;
  }
  .bubble-btn:hover { border-color: var(--accent); }

  /* MENUS */
  .drop-wrapper { position: relative; }
  .drop-menu {
    position: absolute; top: 45px; right: 0; background: #0a0a0a; border: 1px solid var(--accent);
    border-radius: 20px; width: 240px; padding: 10px; display: none; z-index: 100; flex-direction: column;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .drop-menu.open { display: flex; }
  .drop-opt { display: flex; align-items: center; gap: 10px; padding: 10px; cursor: pointer; border-radius: 12px; font-size: 0.8rem; transition: 0.2s; }
  .drop-opt:hover { background: rgba(255,77,0,0.1); }
  .drop-opt.selected { color: var(--accent); font-weight: 700; background: rgba(255,77,0,0.05); }

  /* DASHBOARD */
  .totals { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
  .total-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 25px; }
  .total-card .value { font-size: 2.5rem; font-weight: 900; color: var(--accent); letter-spacing: -1px; }
  .total-card .label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; font-weight: 700; }

  .chart-container { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 15px; margin-bottom: 25px; height: 350px; }
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th { padding: 15px; text-align: left; font-size: 0.65rem; color: var(--muted); text-transform: uppercase; border-bottom: 1px solid var(--border); }
  td { padding: 15px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  .row-chan { display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: #111; object-fit: cover; }

  /* SIDEBAR - OTIMIZADA PARA FLUIDEZ */
  .sidebar-overlay { 
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); 
    z-index: 199; display: none; opacity: 0; transition: opacity 0.2s; 
  }
  .sidebar-overlay.active { display: block; opacity: 1; }
  
  .sidebar { 
    position: fixed; top: 0; right: -350px; width: 320px; height: 100vh; background: #000; 
    border-left: 1px solid var(--accent); z-index: 200; padding: 25px;
    transition: right 0.3s ease-out; /* Transição simples e rápida */
  }
  .sidebar.open { right: 0; }
  .side-card { background: var(--surface); padding: 15px; border-radius: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); }

  @media (max-width: 768px) {
    body { padding: 15px; }
    header { flex-direction: column; gap: 15px; }
    .totals { grid-template-columns: 1fr; }
    .total-card .value { font-size: 2rem; }
    .drop-menu { right: auto; left: 50%; transform: translateX(-50%); width: 280px; }
  }
</style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>

<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <div style="display:flex; justify-content:center; margin-bottom: 20px;">
      <svg width="50" height="50" viewBox="0 0 100 100">
        <rect x="10" y="10" width="80" height="80" rx="20" stroke="#ff4d00" stroke-width="4" fill="none" />
        <rect x="35" y="32" width="10" height="10" fill="#ff4d00" />
        <rect x="35" y="45" width="10" height="10" fill="#ff4d00" />
        <rect x="35" y="58" width="10" height="10" fill="#ff4d00" />
        <rect x="48" y="38.5" width="10" height="10" fill="#ff4d00" />
        <rect x="48" y="51.5" width="10" height="10" fill="#ff4d00" />
        <rect x="61" y="45" width="10" height="10" fill="#ff4d00" />
      </svg>
    </div>
    <input type="password" id="passwordInput" class="auth-input" placeholder="Senha" onkeypress="if(event.key==='Enter') login()">
    <button class="auth-btn" onclick="login()">ENTRAR</button>
  </div>
</div>

<div id="appContent" style="display:none">
  <header>
    <div class="logo-container">
      <svg width="32" height="32" viewBox="0 0 100 100">
        <rect x="10" y="10" width="80" height="80" rx="20" stroke="#ff4d00" stroke-width="6" fill="none" />
        <rect x="35" y="32" width="10" height="10" fill="#ff4d00" />
        <rect x="35" y="45" width="10" height="10" fill="#ff4d00" />
        <rect x="35" y="58" width="10" height="10" fill="#ff4d00" />
        <rect x="48" y="38.5" width="10" height="10" fill="#ff4d00" />
        <rect x="48" y="51.5" width="10" height="10" fill="#ff4d00" />
        <rect x="61" y="45" width="10" height="10" fill="#ff4d00" />
      </svg>
      <div class="logo-text">Automata</div>
    </div>
    
    <div class="header-controls">
      <div class="drop-wrapper">
        <button class="bubble-btn" id="btnCanais" onclick="toggleDrop('dropCanais')">Todos os Canais ▾</button>
        <div class="drop-menu" id="dropCanais"></div>
      </div>
      <div class="drop-wrapper">
        <button class="bubble-btn" id="btnPeriodo" onclick="toggleDrop('dropDatas')">28 Dias ▾</button>
        <div class="drop-menu" id="dropDatas">
          <div class="drop-opt" onclick="setPreset(1)">Último Dia</div>
          <div class="drop-opt" onclick="setPreset(7)">Últimos 7 Dias</div>
          <div class="drop-opt selected" id="opt28" onclick="setPreset(28)">Últimos 28 Dias</div>
          <div class="drop-opt" onclick="setPreset(90)">Últimos 90 Dias</div>
          <div id="monthOptions"></div> 
        </div>
      </div>
      <button class="bubble-btn" onclick="toggleSidebar(true)">⋮</button>
    </div>
  </header>

  <div class="totals">
    <div class="total-card"><div class="label" id="labelRevenue">Receita</div><div class="value" id="totalRevenue">$0.00</div></div>
    <div class="total-card"><div class="label" id="labelViews">Views</div><div class="value" id="totalViews">0</div></div>
  </div>
  <div class="chart-container"><canvas id="mainChart"></canvas></div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Canal</th><th>Receita</th><th>Views</th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<div class="sidebar" id="sidebar">
  <div style="display:flex; justify-content:space-between; margin-bottom:20px">
    <h3 style="font-weight:800">Conexões</h3>
    <button class="bubble-btn" onclick="toggleSidebar(false)" style="border-color:var(--accent); color:var(--accent)">✕</button>
  </div>
  <div id="sidebarContent"></div>
</div>

<script>
const CHANNELS = [
  { id: 'UC_RatoFIT', name: 'RatoFIT' }, { id: 'UC_ZeroHora', name: 'Zero Hora' },
  { id: 'UC_VelozCuriosos', name: 'Velozes & Curiosos' }, { id: 'UC_ComptonKings', name: 'Compton Kings' },
  { id: 'UC_Pixelando', name: 'Pixelando 165' }, { id: 'UC_McQueeeen', name: 'McQueeeen' },
  { id: 'UC_RatoMaromba', name: 'Rato Maromba' }, { id: 'UC_GroveStreet', name: 'Grove Street Style' },
  { id: 'UC_BerserkMode', name: 'Berserk Mode' }, { id: 'UC_OnePunchFights', name: 'One Punch Fights' },
  { id: 'UC_UltimoPeao', name: 'O Último Peão' }, { id: 'UC_EcosDaMente', name: 'Ecos da Mente' }
];

const CHANNEL_IDS = {
  'UC_RatoFIT': 'UCR61DCrMZx-g3irgqgoT5JA', 'UC_ZeroHora': 'UC6sh-Qiz2gj_uqUdYfYnX6w',
  'UC_VelozCuriosos': 'UCXMwjsceXKA5dqbWSWE-_7Q', 'UC_ComptonKings': 'UCGqLCGdh5xUJiQW416DQWjA',
  'UC_Pixelando': 'UCzE6ujftVmVmEvGJW0MArlw', 'UC_McQueeeen': 'UCMNvTCr-RwLVRW-jDIQVnBw',
  'UC_RatoMaromba': 'UCxslmo0asWXgdWObPO8BFrQ', 'UC_GroveStreet': 'UChQfM3wIfo84Ab0WeW9CwCA',
  'UC_BerserkMode': 'UCzkne80zh104CdG3kDrTQ1w', 'UC_OnePunchFights': 'UChdMYJwcBpizC4NLh5dRh4g',
  'UC_UltimoPeao': 'UCkdnxxobb7NvO6EX2kLqv4A', 'UC_EcosDaMente': 'UCpCEVQUoScH3SNPZjEcAWpg',
};

let accounts = {}, results = {}, thumbs = {}, activePeriod = 28, myChart = null;
let selectedChannels = new Set(CHANNELS.map(c => c.id));
let isUserFiltering = false;

async function login() {
  const pwd = document.getElementById('passwordInput').value;
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pwd }) });
  if (r.ok) { document.getElementById('authOverlay').classList.add('hidden'); document.getElementById('appContent').style.display='block'; initApp(); }
}

async function initApp() {
  await loadAccounts(); await loadThumbs();
  renderCanais(); renderMeses(); renderSidebar(); initChart(); fetchAll();
}

async function loadAccounts() { try { const r = await fetch('/api/accounts'); accounts = await r.json(); } catch(e){} }
async function loadThumbs() {
  const ids = Object.values(CHANNEL_IDS).join(',');
  const r = await fetch('/api/channel-thumbs?ids=' + ids);
  const data = await r.json();
  if(data.ok) Object.keys(CHANNEL_IDS).forEach(key => { thumbs[key] = data.thumbs[CHANNEL_IDS[key]]; });
}

function toggleDrop(id) {
  const el = document.getElementById(id);
  const isO = el.classList.contains('open');
  document.querySelectorAll('.drop-menu').forEach(d => d.classList.remove('open'));
  if(!isO) el.classList.add('open');
  if(id === 'dropCanais') renderCanais();
}

function renderCanais() {
  const drop = document.getElementById('dropCanais'); drop.innerHTML = '';
  const allSelected = selectedChannels.size === CHANNELS.length;

  CHANNELS.forEach(ch => {
    // Se "todos" estiverem ativos e o usuário abrir o menu, mostramos como "desmarcado" visualmente
    const isS = allSelected ? false : selectedChannels.has(ch.id);
    const div = document.createElement('div');
    div.className = `drop-opt ${isS ? 'selected' : ''}`;
    div.innerHTML = `<img src="${thumbs[ch.id] || ''}" class="avatar"> <span>${ch.name}</span>`;
    div.onclick = (e) => { 
        e.stopPropagation(); 
        // Se clicar em um canal quando "Todos" estão ativos, o dashboard foca apenas nele
        if (allSelected) {
            selectedChannels.clear();
            selectedChannels.add(ch.id);
        } else {
            if(selectedChannels.has(ch.id)) {
                selectedChannels.delete(ch.id);
                if(selectedChannels.size === 0) CHANNELS.forEach(c => selectedChannels.add(c.id));
            } else {
                selectedChannels.add(ch.id);
            }
        }
        renderCanais();
        updateUI();
    };
    drop.appendChild(div);
  });
  document.getElementById('btnCanais').innerText = selectedChannels.size === CHANNELS.length ? 'Todos os Canais ▾' : `${selectedChannels.size} Selecionados ▾`;
}

function renderMeses() {
  const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
  const container = document.getElementById('monthOptions'); container.innerHTML = '';
  const d = new Date();
  for(let i=0; i<3; i++) {
    const m = new Date(d.getFullYear(), d.getMonth() - i, 1);
    const opt = document.createElement('div'); opt.className = 'drop-opt'; opt.innerText = monthNames[m.getMonth()];
    opt.onclick = () => {
      const first = new Date(m.getFullYear(), m.getMonth(), 1).toISOString().split('T')[0];
      const last = new Date(m.getFullYear(), m.getMonth() + 1, 0).toISOString().split('T')[0];
      activePeriod = 'custom'; fetchAll(first, last);
      document.getElementById('btnPeriodo').innerText = monthNames[m.getMonth()] + ' ▾';
    };
    container.appendChild(opt);
  }
}

function setPreset(days) {
  activePeriod = days;
  document.getElementById('btnPeriodo').innerText = (days === 1 ? 'Último Dia' : days + ' Dias') + ' ▾';
  fetchAll();
}

async function fetchAll(customS, customE) {
  let start, end = new Date().toISOString().split('T')[0];
  if(customS) { start = customS; end = customE; }
  else {
    const d = new Date(); d.setDate(d.getDate() - (activePeriod === 1 ? 5 : activePeriod));
    start = d.toISOString().split('T')[0];
  }
  const promises = CHANNELS.map(ch => fetchChannel(ch, start, end));
  await Promise.all(promises);
  updateUI();
}

async function fetchChannel(ch, start, end) {
  try {
    const r = await fetch(`/api/analytics?channelId=${CHANNEL_IDS[ch.id]}&startDate=${start}&endDate=${end}`);
    const data = await r.json(); results[ch.id] = data.ok ? data.rows : [];
  } catch(e) { results[ch.id] = []; }
}

function updateUI() {
  const tbody = document.getElementById('tableBody'); tbody.innerHTML = '';
  let tR = 0, tV = 0, dD = {}, maxDate = null;

  if(activePeriod === 1) {
    let allDates = [];
    Object.values(results).forEach(rows => rows.forEach(r => { if(r[1] > 0) allDates.push(r[0]); }));
    maxDate = allDates.length ? allDates.sort().reverse()[0] : null;
    const disp = maxDate ? maxDate.split('-').reverse().join('/') : '---';
    document.getElementById('labelRevenue').innerText = 'Receita ('+disp+')';
  } else { document.getElementById('labelRevenue').innerText = 'Receita'; }

  CHANNELS.forEach(ch => {
    if(!selectedChannels.has(ch.id)) return;
    let rows = results[ch.id] || [];
    if(activePeriod === 1) rows = rows.filter(r => r[0] === maxDate);
    const rS = rows.reduce((a, b) => a + b[1], 0);
    const vS = rows.reduce((a, b) => a + b[2], 0);
    tR += rS; tV += vS;
    rows.forEach(r => dD[r[0]] = (dD[r[0]] || 0) + r[1]);
    tbody.innerHTML += `<tr><td><div class="row-chan"><img src="${thumbs[ch.id]}" class="avatar">${ch.name}</div></td><td style="color:var(--accent);font-weight:800">$${rS.toFixed(2)}</td><td>${vS.toLocaleString()}</td></tr>`;
  });
  document.getElementById('totalRevenue').innerText = `$${tR.toFixed(2)}`;
  document.getElementById('totalViews').innerText = tV.toLocaleString();
  updateChart(dD);
}

function toggleSidebar(open) {
  const s = document.getElementById('sidebar'); const o = document.getElementById('sidebarOverlay');
  if (open) { s.classList.add('open'); o.classList.add('active'); }
  else { s.classList.remove('open'); o.classList.remove('active'); }
}

function renderSidebar() {
  const content = document.getElementById('sidebarContent'); content.innerHTML = '';
  CHANNELS.forEach(ch => {
    const isC = !!accounts[ch.id];
    content.innerHTML += `<div class="side-card">
      <div style="display:flex;align-items:center;gap:12px">
        <img src="${thumbs[ch.id]}" class="avatar">
        <div><b>${ch.name}</b><br><small style="color:${isC?'var(--accent)':'#666'}">${isC ? 'ONLINE' : 'PENDENTE'}</small></div>
      </div>
      <a href="/auth/${ch.id}" class="bubble-btn" style="text-decoration:none; color:${isC?'var(--accent)':'#000'}; background:${isC?'transparent':'var(--accent)'}">${isC ? 'OK' : 'LINK'}</a>
    </div>`;
  });
}

function initChart() {
  const ctx = document.getElementById('mainChart').getContext('2d');
  myChart = new Chart(ctx, {
    type: 'line',
    data: { labels: [], datasets: [{ label: 'Receita', data: [], borderColor: '#ff4d00', tension: 0.4, fill: true, backgroundColor: 'rgba(255, 77, 0, 0.05)', borderWidth: 3, pointRadius: 3 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { grid: { color: '#111' } }, x: { grid: { display: false } } } }
  });
}

function updateChart(dailyData) {
  const sorted = Object.keys(dailyData).sort();
  myChart.data.labels = sorted.map(d => d.split('-').reverse().slice(0,2).join('/'));
  myChart.data.datasets[0].data = sorted.map(d => dailyData[d]);
  myChart.update();
}

document.addEventListener('click', (e) => { if(!e.target.closest('.drop-wrapper')) document.querySelectorAll('.drop-menu').forEach(d => d.classList.remove('open')); });
</script>
</body>
</html>
