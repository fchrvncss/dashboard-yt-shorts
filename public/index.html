<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Automata YT</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  :root {
    --bg: #000000; --surface: #0a0a0a; --border: #1a1a1a;
    --accent: #ff4d00; --accent-hover: #ff6a2b; --text: #ffffff; --muted: #666;
    --semi-orange: rgba(255, 77, 0, 0.2);
    --ease: cubic-bezier(0.165, 0.84, 0.44, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  html, body { overflow-x: hidden; width: 100%; background: var(--bg); }
  body { color: var(--text); font-family: 'Inter', sans-serif; padding: 24px; min-height: 100vh; }

  /* INTERAÇÕES */
  .drop-opt, .side-card, .bubble-btn, .total-card, .auth-btn, .clear-extension { transition: all 0.3s var(--ease); }
  .drop-opt:hover { background: var(--semi-orange) !important; color: #ff9d66 !important; }

  /* BOTÃO EXTENSÃO "X" */
  .filter-group { display: flex; align-items: center; position: relative; }
  .clear-extension {
    background: var(--surface); border: 1px solid var(--border); border-right: none;
    height: 38px; color: var(--text); display: flex; align-items: center; justify-content: center;
    border-radius: 50px 0 0 50px; overflow: hidden; cursor: pointer;
    width: 0; opacity: 0; white-space: nowrap; font-size: 1rem; font-weight: 800; pointer-events: none;
  }
  .clear-extension.active { width: 44px; opacity: 1; pointer-events: auto; }
  .clear-extension.active:hover { width: 160px; background: var(--surface) !important; color: var(--accent) !important; border-color: var(--accent); }
  .clear-extension span { font-size: 0.75rem; opacity: 0; width: 0; transition: 0.3s; display: inline-block; overflow: hidden; }
  .clear-extension.active:hover span { opacity: 1; width: auto; margin-left: 10px; }

  .bubble-btn { background: var(--surface); border: 1px solid var(--border); color: #fff; padding: 10px 20px; border-radius: 50px; cursor: pointer; font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; gap: 6px; height: 38px; }
  .clear-extension.active + .drop-wrapper .btn-canais { border-radius: 0 50px 50px 0; border-left: 1px solid transparent; }

  /* HEADER & CONTROLS */
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  .logo-container { display: flex; align-items: center; gap: 12px; }
  .logo-text { font-size: 1.5rem; font-weight: 800; letter-spacing: -1px; }
  .header-controls { display: flex; gap: 10px; align-items: center; }

  /* DROPDOWN MENU - FILTRO CANAIS */
  .drop-wrapper { position: relative; }
  .drop-menu {
    position: absolute; top: 45px; right: 0; background: #0a0a0a; border: 1px solid var(--accent);
    border-radius: 20px; width: 260px; padding: 12px; display: none; z-index: 100; flex-direction: column;
    box-shadow: 0 10px 40px rgba(0,0,0,0.9);
    max-height: 420px; overflow-y: auto; scrollbar-width: none;
  }
  .drop-menu.open { display: flex; }
  .drop-opt { display: flex; align-items: center; gap: 10px; padding: 12px; cursor: pointer; border-radius: 12px; font-size: 0.85rem; color: #ccc; }
  .drop-opt.selected { color: var(--accent) !important; font-weight: 800; background: rgba(255, 77, 0, 0.1) !important; }

  /* BOTÃO APLICAR */
  .apply-filter-btn {
    background: #000; color: var(--accent); border: 1px solid var(--accent); padding: 12px; border-radius: 12px;
    font-weight: 800; font-size: 0.75rem; cursor: pointer; margin-top: 10px;
    position: sticky; bottom: 0; width: 100%; text-transform: uppercase; transition: 0.2s;
  }
  .apply-filter-btn:hover { background: var(--semi-orange); }

  /* DASHBOARD GRID */
  .totals { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 25px; }
  .total-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 25px; }
  .total-card .value { font-size: 2.2rem; font-weight: 900; color: var(--accent); letter-spacing: -1px; }
  .total-card .label { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; font-weight: 700; }

  .chart-container { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 15px; margin-bottom: 25px; height: 350px; }
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th { padding: 15px; text-align: left; font-size: 0.65rem; color: var(--muted); text-transform: uppercase; border-bottom: 1px solid var(--border); }
  td { padding: 15px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: #111; object-fit: cover; }

  /* MOBILE FIXES */
  @media (max-width: 900px) { .totals { grid-template-columns: 1fr; } }
  @media (max-width: 768px) {
    body { padding: 10px; padding-top: 5px; }
    header { flex-direction: column; gap: 12px; margin-bottom: 15px; padding-bottom: 15px; }
    .header-controls { width: 100%; justify-content: center; }
    .drop-menu { 
      position: fixed; top: auto; bottom: 20px; left: 50%; right: auto; 
      transform: translateX(-50%); width: 94vw; max-width: 350px; z-index: 1001;
    }
  }
</style>
</head>
<body>

<div id="appContent">
  <header>
    <div class="logo-container">
      <svg width="30" height="30" viewBox="0 0 100 100"><rect x="10" y="10" width="80" height="80" rx="20" stroke="#ff4d00" stroke-width="6" fill="none" /><rect x="35" y="32" width="10" height="10" fill="#ff4d00" /><rect x="35" y="45" width="10" height="10" fill="#ff4d00" /><rect x="35" y="58" width="10" height="10" fill="#ff4d00" /><rect x="48" y="38.5" width="10" height="10" fill="#ff4d00" /><rect x="48" y="51.5" width="10" height="10" fill="#ff4d00" /><rect x="61" y="45" width="10" height="10" fill="#ff4d00" /></svg>
      <div class="logo-text">Automata</div>
    </div>
    <div class="header-controls">
      <div class="filter-group">
        <div class="clear-extension" id="clearBtn" onclick="resetFiltersAndClose()">✕<span>Limpar Filtros</span></div>
        <div class="drop-wrapper">
          <button class="bubble-btn btn-canais" id="btnCanais" onclick="toggleDrop('dropCanais')">Canais ▾</button>
          <div class="drop-menu" id="dropCanais"></div>
        </div>
      </div>
      <div class="drop-wrapper">
        <button class="bubble-btn" id="btnPeriodo" onclick="toggleDrop('dropDatas')">28 Dias ▾</button>
        <div class="drop-menu" id="dropDatas">
          <div class="drop-opt" id="opt-1" onclick="setPreset(1)">Último Dia</div>
          <div class="drop-opt" id="opt-7" onclick="setPreset(7)">Últimos 7 Dias</div>
          <div class="drop-opt selected" id="opt-28" onclick="setPreset(28)">Últimos 28 Dias</div>
          <div class="drop-opt" id="opt-90" onclick="setPreset(90)">Últimos 90 Dias</div>
          <div id="monthOptions"></div> 
        </div>
      </div>
      <button class="bubble-btn" onclick="toggleSidebar(true)">⋮</button>
    </div>
  </header>

  <div class="totals">
    <div class="total-card"><div class="label" id="labelRevenue">Receita Total</div><div class="value" id="totalRevenue">$0.00</div></div>
    <div class="total-card"><div class="label">Views Totais</div><div class="value" id="totalViews">0</div></div>
    <div class="total-card"><div class="label">RPM Médio</div><div class="value" id="totalRPM">$0.00</div></div>
  </div>
  <div class="chart-container"><canvas id="mainChart"></canvas></div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Canal</th><th>Receita</th><th>Views</th><th>RPM</th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
const CHANNELS = [
  { id: 'UC_RatoFIT', name: 'RatoFIT' }, { id: 'UC_ZeroHora', name: 'Zero Hora' }, { id: 'UC_VelozCuriosos', name: 'Velozes & Curiosos' }, { id: 'UC_ComptonKings', name: 'Compton Kings' }, { id: 'UC_Pixelando', name: 'Pixelando 165' }, { id: 'UC_McQueeeen', name: 'McQueeeen' }, { id: 'UC_RatoMaromba', name: 'Rato Maromba' }, { id: 'UC_GroveStreet', name: 'Grove Street Style' }, { id: 'UC_BerserkMode', name: 'Berserk Mode' }, { id: 'UC_OnePunchFights', name: 'One Punch Fights' }, { id: 'UC_UltimoPeao', name: 'O Último Peão' }, { id: 'UC_EcosDaMente', name: 'Ecos da Mente' }
];
const CHANNEL_IDS = { 'UC_RatoFIT': 'UCR61DCrMZx-g3irgqgoT5JA', 'UC_ZeroHora': 'UC6sh-Qiz2gj_uqUdYfYnX6w', 'UC_VelozCuriosos': 'UCXMwjsceXKA5dqbWSWE-_7Q', 'UC_ComptonKings': 'UCGqLCGdh5xUJiQW416DQWjA', 'UC_Pixelando': 'UCzE6ujftVmVmEvGJW0MArlw', 'UC_McQueeeen': 'UCMNvTCr-RwLVRW-jDIQVnBw', 'UC_RatoMaromba': 'UCxslmo0asWXgdWObPO8BFrQ', 'UC_GroveStreet': 'UChQfM3wIfo84Ab0WeW9CwCA', 'UC_BerserkMode': 'UCzkne80zh104CdG3kDrTQ1w', 'UC_OnePunchFights': 'UChdMYJwcBpizC4NLh5dRh4g', 'UC_UltimoPeao': 'UCkdnxxobb7NvO6EX2kLqv4A', 'UC_EcosDaMente': 'UCpCEVQUoScH3SNPZjEcAWpg' };

let results = {}, thumbs = {}, activePeriod = 28, myChart = null, cache = {};
let selectedChannels = new Set(CHANNELS.map(c => c.id));

function toggleDrop(id) {
  const el = document.getElementById(id);
  const isO = el.classList.contains('open');
  document.querySelectorAll('.drop-menu').forEach(d => d.classList.remove('open'));
  if(!isO) el.classList.add('open');
  if(id === 'dropCanais') renderCanais();
}

function resetFiltersAndClose() {
  selectedChannels = new Set(CHANNELS.map(c => c.id));
  document.querySelectorAll('.drop-menu').forEach(d => d.classList.remove('open'));
  renderCanais(); updateUI();
}

function renderCanais() {
  const drop = document.getElementById('dropCanais'); drop.innerHTML = '';
  const allActive = selectedChannels.size === CHANNELS.length;
  const clearBtn = document.getElementById('clearBtn');
  if (!allActive) clearBtn.classList.add('active'); else clearBtn.classList.remove('active');

  CHANNELS.forEach(ch => {
    const isS = allActive ? false : selectedChannels.has(ch.id);
    const div = document.createElement('div'); div.className = `drop-opt ${isS ? 'selected' : ''}`;
    div.innerHTML = `<img src="${thumbs[ch.id] || ''}" class="avatar"> <span>${ch.name}</span>`;
    div.onclick = (e) => { 
        e.stopPropagation(); 
        if (allActive) { selectedChannels.clear(); selectedChannels.add(ch.id); } 
        else { if(selectedChannels.has(ch.id)) { selectedChannels.delete(ch.id); if(selectedChannels.size === 0) selectedChannels = new Set(CHANNELS.map(c => c.id)); } else { selectedChannels.add(ch.id); } }
        renderCanais(); updateUI();
    };
    drop.appendChild(div);
  });

  const applyBtn = document.createElement('button');
  applyBtn.className = 'apply-filter-btn';
  applyBtn.innerText = 'Aplicar';
  applyBtn.onclick = () => { document.getElementById('dropCanais').classList.remove('open'); };
  drop.appendChild(applyBtn);

  document.getElementById('btnCanais').innerText = selectedChannels.size === CHANNELS.length ? 'Canais ▾' : `${selectedChannels.size} Selecionados ▾`;
}

// ... Restante do script de atualização e fetch (updateUI, fetchAll, etc) ...

window.onload = () => { renderCanais(); initChart(); fetchAll(); };
</script>
</body>
</html>
