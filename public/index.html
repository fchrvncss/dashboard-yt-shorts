<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Automata YT</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='80' height='80' rx='20' stroke='%23ff4d00' stroke-width='6' fill='none'/><rect x='35' y='32' width='10' height='10' fill='%23ff4d00'/><rect x='35' y='45' width='10' height='10' fill='%23ff4d00'/><rect x='35' y='58' width='10' height='10' fill='%23ff4d00'/><rect x='48' y='38.5' width='10' height='10' fill='%23ff4d00'/><rect x='48' y='51.5' width='10' height='10' fill='%23ff4d00'/><rect x='61' y='45' width='10' height='10' fill='%23ff4d00'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg:#000; --surface:#0a0a0a; --border:#1a1a1a;
    --accent:#ff4d00; --text:#fff; --muted:#555;
    --semi-orange:rgba(255,77,0,0.18);
    --ease:cubic-bezier(0.165,0.84,0.44,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{overflow-x:hidden;width:100%;background:var(--bg);height:100%;}
  body{color:var(--text);font-family:'Inter',sans-serif;padding:24px;}
  body.no-scroll{overflow:hidden;}

  /* BASE INTERACTIONS */
  .drop-opt,.side-card,.bubble-btn,.total-card,.auth-btn,.clear-extension{transition:all 0.3s var(--ease);}
  .drop-opt:hover,.side-card:hover{transform:scale(1.02);background:var(--semi-orange)!important;color:#ff9d66!important;}
  .total-card:hover{transform:scale(1.02);border-color:var(--accent);}

  /* FILTER GROUP */
  .filter-group{display:flex;align-items:center;position:relative;}
  .clear-extension{background:var(--surface);border:1px solid var(--border);border-right:none;height:38px;color:var(--text);display:flex;align-items:center;justify-content:center;border-radius:50px 0 0 50px;overflow:hidden;cursor:pointer;width:0;opacity:0;white-space:nowrap;font-size:1rem;font-weight:800;pointer-events:none;}
  .clear-extension.active{width:44px;opacity:1;pointer-events:auto;}
  .clear-extension.active:hover{width:160px;background:var(--accent)!important;color:#000!important;border-color:var(--accent);}
  .clear-extension span{font-size:0.75rem;opacity:0;width:0;transition:0.3s;display:inline-block;overflow:hidden;}
  .clear-extension.active:hover span{opacity:1;width:auto;margin-left:10px;}
  .bubble-btn{background:var(--surface);border:1px solid var(--border);color:#fff;padding:10px 20px;border-radius:50px;cursor:pointer;font-size:0.8rem;font-weight:600;display:flex;align-items:center;gap:6px;height:38px;}
  .clear-extension.active+.drop-wrapper .btn-canais{border-radius:0 50px 50px 0;border-left:1px solid transparent;}

  /* AUTH */
  .auth-overlay{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;align-items:center;justify-content:center;}
  .auth-overlay.hidden{display:none;}
  .auth-card{background:var(--surface);border:1px solid var(--accent);padding:40px;border-radius:30px;width:320px;text-align:center;}
  .auth-input{width:100%;padding:15px;background:#000;border:1px solid var(--border);color:#fff;border-radius:50px;margin-bottom:20px;text-align:center;outline:none;font-family:'Space Mono',monospace;}
  .auth-btn{width:100%;padding:15px;background:var(--accent);color:#000;border:none;border-radius:50px;font-weight:800;cursor:pointer;}

  /* HEADER */
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px;padding-bottom:20px;border-bottom:1px solid var(--border);}
  .logo-container{display:flex;align-items:center;gap:12px;}
  .logo-text{font-size:1.5rem;font-weight:800;letter-spacing:-1px;}
  .header-controls{display:flex;gap:10px;align-items:center;}

  /* DROPDOWNS */
  .drop-wrapper{position:relative;}
  .drop-menu{position:absolute;top:45px;right:0;background:#0a0a0a;border:1px solid var(--accent);border-radius:20px;width:260px;padding:12px;display:none;z-index:100;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,0.9);max-height:400px;overflow-y:auto;scrollbar-width:none;}
  .drop-menu.open{display:flex;}
  .drop-opt{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;border-radius:12px;font-size:0.85rem;color:#ccc;}
  .drop-opt.selected{color:var(--accent)!important;font-weight:800;background:rgba(255,77,0,0.1)!important;}
  .apply-filter-btn{background:#0f0f0f;color:var(--accent);border:1px solid var(--accent);padding:12px;border-radius:12px;font-weight:800;font-size:0.75rem;cursor:pointer;margin-top:10px;position:sticky;bottom:0;width:100%;text-transform:uppercase;transition:0.2s;}
  .apply-filter-btn:hover{background:var(--accent);color:#000;}

  /* TOTAIS */
  .totals{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:25px;}
  .total-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:25px;}
  .total-card .value{font-size:2.2rem;font-weight:900;color:var(--accent);letter-spacing:-1px;}
  .total-card .label{font-size:0.65rem;color:var(--muted);text-transform:uppercase;margin-bottom:5px;font-weight:700;}

  /* GRÁFICO PRINCIPAL */
  .chart-container{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px 20px 12px;margin-bottom:25px;height:320px;position:relative;}
  .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;}
  th{padding:15px;text-align:left;font-size:0.65rem;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--border);}
  td{padding:15px;border-bottom:1px solid var(--border);font-size:0.9rem;}
  .row-chan{display:flex;align-items:center;gap:10px;font-weight:700;}
  .avatar{width:30px;height:30px;border-radius:50%;background:#111;object-fit:cover;}

  /* SIDEBAR */
  .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:199;display:none;}
  .sidebar-overlay.active{display:block;}
  .sidebar{position:fixed;top:0;right:-350px;width:320px;height:100vh;background:#000;border-left:1px solid var(--accent);z-index:200;padding:25px;transition:right 0.3s var(--ease);overflow-y:auto;scrollbar-width:none;}
  .sidebar.open{right:0;}
  .side-card{background:var(--surface);padding:18px;border-radius:20px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);cursor:pointer;}
  .status-ball{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;}
  .status-ball.active{background:var(--accent);}

  /* CANAL CLICÁVEL */
  .channel-row{cursor:pointer;}
  .channel-row:hover td{background:rgba(255,77,0,0.06);}
  .channel-row:hover .row-chan{transform:scale(1.02);}
  .row-chan{transition:transform 0.25s var(--ease);}

  /* ABA EXPANSÍVEL */
  .channel-detail-row td{padding:0!important;border-bottom:none;}
  .channel-detail-inner{overflow:hidden;max-height:0;transition:max-height 0.5s var(--ease),opacity 0.4s ease;opacity:0;}
  .channel-detail-inner.open{max-height:2000px;opacity:1;}
  .channel-detail-content{padding:20px;background:#030303;border-top:1px solid var(--border);border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
  .detail-block{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;overflow:hidden;}
  .detail-block-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .detail-block-header h4{font-size:0.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700;}

  /* CARD DE VÍDEO */
  .video-card{display:flex;flex-direction:column;gap:0;border-radius:12px;overflow:hidden;border:1px solid var(--border);transition:border-color 0.2s,transform 0.2s var(--ease);cursor:pointer;background:#0d0d0d;}
  .video-card:hover{border-color:rgba(255,77,0,0.4);transform:translateY(-2px);}
  .video-card.latest{border-color:var(--accent);}
  .video-card-thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#111;display:block;}
  .video-card-body{padding:8px 10px;}
  .video-card-title{font-size:0.72rem;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px;}
  .video-card-badge{display:inline-block;font-size:0.52rem;background:var(--accent);color:#000;padding:2px 6px;border-radius:4px;font-weight:800;margin-bottom:6px;}
  .video-card-icons{display:flex;gap:10px;flex-wrap:wrap;}
  .video-icon{display:flex;align-items:center;gap:4px;font-size:0.62rem;color:var(--muted);}
  .video-icon svg{width:11px;height:11px;fill:var(--muted);flex-shrink:0;}
  .video-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

  /* EXPANDIR */
  .expand-btn{width:100%;margin-top:10px;padding:8px;border-radius:10px;background:transparent;border:1px solid var(--border);color:var(--muted);font-size:0.7rem;font-weight:700;cursor:pointer;transition:all 0.2s;}
  .expand-btn:hover{border-color:var(--accent);color:var(--accent);}

  /* GRÁFICO DETALHE */
  .detail-chart-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
  .chart-filter-btns{display:flex;gap:5px;}
  .chart-filter-btn{padding:4px 10px;border-radius:50px;font-size:0.65rem;font-weight:700;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all 0.2s;}
  .chart-filter-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(255,77,0,0.08);}
  .period-select-wrap{position:relative;}
  .period-select-btn{padding:4px 10px;border-radius:50px;font-size:0.65rem;font-weight:700;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all 0.2s;}
  .period-select-btn:hover{border-color:var(--accent);color:var(--accent);}
  .period-drop{position:absolute;top:30px;right:0;background:#0a0a0a;border:1px solid var(--accent);border-radius:14px;padding:8px;display:none;z-index:300;flex-direction:column;min-width:120px;box-shadow:0 8px 30px rgba(0,0,0,0.9);}
  .period-drop.open{display:flex;}
  .period-opt{padding:7px 12px;border-radius:8px;font-size:0.75rem;color:#ccc;cursor:pointer;transition:background 0.15s;}
  .period-opt:hover{background:var(--semi-orange);color:#ff9d66;}
  .period-opt.selected{color:var(--accent);font-weight:800;background:rgba(255,77,0,0.1);}
  .detail-chart-container{height:160px;position:relative;}
  .detail-loading{text-align:center;padding:30px;color:var(--muted);font-size:0.78rem;}

  /* POPUP */
  .popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,0);backdrop-filter:blur(0px);z-index:500;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:background 0.3s ease,backdrop-filter 0.3s ease;}
  .popup-overlay.open{background:rgba(0,0,0,0.78);backdrop-filter:blur(6px);pointer-events:auto;}
  .popup-box{background:#0a0a0a;border:1px solid var(--accent);border-radius:24px;width:92vw;max-width:880px;max-height:88vh;display:flex;overflow:hidden;position:relative;transform:scale(0.94) translateY(16px);opacity:0;transition:transform 0.35s var(--ease),opacity 0.3s ease;}
  .popup-overlay.open .popup-box{transform:scale(1) translateY(0);opacity:1;}

  /* PAINEL ESQUERDO POPUP */
  .popup-list-panel{width:300px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border);}
  .popup-header{padding:16px 16px 10px;}
  .popup-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .popup-title{font-size:0.85rem;font-weight:800;}
  .popup-total{font-size:0.65rem;color:var(--muted);}
  .popup-search{width:100%;padding:8px 14px;background:#000;border:1px solid var(--border);border-radius:50px;color:#fff;font-size:0.75rem;outline:none;font-family:'Inter',sans-serif;}
  .popup-search:focus{border-color:var(--accent);}
  .popup-nav{display:flex;align-items:center;justify-content:center;gap:4px;padding:8px 16px;border-bottom:1px solid var(--border);}
  .popup-nav-btn{background:transparent;border:1px solid var(--border);color:var(--muted);width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:0.7rem;font-weight:800;transition:all 0.2s;display:flex;align-items:center;justify-content:center;}
  .popup-nav-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
  .popup-nav-btn:disabled{opacity:0.25;cursor:not-allowed;}
  .popup-nav-info{font-size:0.62rem;color:var(--muted);font-family:'Space Mono',monospace;padding:0 6px;}
  .popup-video-list{flex:1;overflow-y:auto;padding:10px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
  .popup-nav-bottom{padding:8px 16px;border-top:1px solid var(--border);}

  /* ITEM DE VÍDEO NO POPUP */
  .popup-video-item{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;cursor:pointer;transition:background 0.2s;border:1px solid transparent;margin-bottom:4px;}
  .popup-video-item:hover{background:rgba(255,77,0,0.06);}
  .popup-video-item.active{border-color:var(--accent);background:rgba(255,77,0,0.08);}
  .popup-video-item .pv-thumb{width:72px;height:40px;border-radius:6px;object-fit:cover;background:#111;flex-shrink:0;}
  .popup-video-item .pv-info{flex:1;min-width:0;}
  .popup-video-item .pv-title{font-size:0.72rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .popup-video-item .pv-meta{font-size:0.62rem;color:var(--muted);margin-top:2px;}

  /* PAINEL DIREITO POPUP */
  .popup-detail-panel{flex:1;overflow-y:auto;padding:20px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;transform:translateX(16px);opacity:0;transition:transform 0.35s var(--ease),opacity 0.3s ease;pointer-events:none;}
  .popup-detail-panel.visible{transform:translateX(0);opacity:1;pointer-events:auto;}
  .popup-detail-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:0.8rem;gap:10px;text-align:center;}
  .popup-close{position:absolute;top:14px;right:14px;background:transparent;border:1px solid var(--border);color:var(--muted);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:0.9rem;display:flex;align-items:center;justify-content:center;transition:all 0.2s;z-index:10;}
  .popup-close:hover{border-color:var(--accent);color:var(--accent);}

  /* MÉTRICAS DO VÍDEO */
  .popup-video-preview{display:flex;gap:12px;align-items:flex-start;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--border);}
  .popup-video-preview img{width:120px;height:68px;border-radius:8px;object-fit:cover;flex-shrink:0;}
  .popup-video-preview-title{font-size:0.82rem;font-weight:700;line-height:1.4;}
  .popup-video-preview-date{font-size:0.68rem;color:var(--muted);margin-top:4px;}
  .metrics-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .metric-card{background:#0d0d0d;border:1px solid var(--border);border-radius:12px;padding:14px;}
  .metric-card .m-label{font-size:0.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;font-weight:700;}
  .metric-card .m-value{font-size:1.35rem;font-weight:800;color:var(--accent);letter-spacing:-0.5px;}
  .metric-card .m-sub{font-size:0.62rem;color:var(--muted);margin-top:2px;}
  .metrics-loading{text-align:center;padding:40px;color:var(--muted);font-size:0.8rem;}

  @media(max-width:900px){
    .totals{grid-template-columns:1fr;}
    .channel-detail-content{grid-template-columns:1fr;}
    .popup-box{flex-direction:column;max-height:92vh;}
    .popup-list-panel{width:100%;max-height:45vh;border-right:none;border-bottom:1px solid var(--border);}
    .popup-detail-panel{max-height:47vh;}
    .video-list{grid-template-columns:1fr;}
  }
  @media(max-width:768px){
    body{padding:10px;padding-top:5px;}
    header{flex-direction:column;gap:12px;margin-bottom:15px;}
    .header-controls{width:100%;justify-content:center;flex-wrap:wrap;}
    .drop-menu{position:fixed;top:auto;bottom:20px;left:50%;right:auto;transform:translateX(-50%);width:94vw;max-width:350px;z-index:1001;}
  }
</style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>

<!-- POPUP -->
<div class="popup-overlay" id="popupOverlay" onclick="handlePopupOverlayClick(event)">
  <div class="popup-box" id="popupBox">
    <button class="popup-close" onclick="closePopup()">✕</button>
    <div class="popup-list-panel">
      <div class="popup-header">
        <div class="popup-title-row">
          <div class="popup-title" id="popupTitle">Vídeos</div>
          <div class="popup-total" id="popupTotal"></div>
        </div>
        <input class="popup-search" id="popupSearch" placeholder="Buscar vídeo..." oninput="filterPopupVideos()">
      </div>
      <div class="popup-nav" id="popupNavTop">
        <button class="popup-nav-btn" id="navFirst" onclick="popupGoPage('first')" title="Primeiro">|◀</button>
        <button class="popup-nav-btn" id="navPrev" onclick="popupGoPage('prev')" title="Anterior">◀</button>
        <div class="popup-nav-info" id="popupNavInfo">—</div>
        <button class="popup-nav-btn" id="navNext" onclick="popupGoPage('next')" title="Próximo">▶</button>
        <button class="popup-nav-btn" id="navLast" onclick="popupGoPage('last')" title="Último">▶|</button>
      </div>
      <div class="popup-video-list" id="popupVideoList"></div>
      <div class="popup-nav-bottom">
        <div class="popup-nav" style="border:none;padding:4px 0">
          <button class="popup-nav-btn" onclick="popupGoPage('first')" title="Primeiro">|◀</button>
          <button class="popup-nav-btn" id="navPrevB" onclick="popupGoPage('prev')" title="Anterior">◀</button>
          <div class="popup-nav-info" id="popupNavInfoB">—</div>
          <button class="popup-nav-btn" id="navNextB" onclick="popupGoPage('next')" title="Próximo">▶</button>
          <button class="popup-nav-btn" onclick="popupGoPage('last')" title="Último">▶|</button>
        </div>
      </div>
    </div>
    <div class="popup-detail-panel" id="popupDetailPanel">
      <div class="popup-detail-empty" id="popupDetailEmpty">
        <span style="font-size:2rem;opacity:0.3">◀</span>
        <span>Selecione um vídeo<br>para ver as métricas</span>
      </div>
      <div id="popupDetailContent" style="display:none"></div>
    </div>
  </div>
</div>

<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <div style="display:flex;justify-content:center;margin-bottom:20px;">
      <svg width="50" height="50" viewBox="0 0 100 100"><rect x="10" y="10" width="80" height="80" rx="20" stroke="#ff4d00" stroke-width="4" fill="none"/><rect x="35" y="32" width="10" height="10" fill="#ff4d00"/><rect x="35" y="45" width="10" height="10" fill="#ff4d00"/><rect x="35" y="58" width="10" height="10" fill="#ff4d00"/><rect x="48" y="38.5" width="10" height="10" fill="#ff4d00"/><rect x="48" y="51.5" width="10" height="10" fill="#ff4d00"/><rect x="61" y="45" width="10" height="10" fill="#ff4d00"/></svg>
    </div>
    <input type="password" id="passwordInput" class="auth-input" placeholder="Senha" onkeypress="if(event.key==='Enter') login()">
    <button class="auth-btn" onclick="login()">ENTRAR</button>
  </div>
</div>

<div id="appContent" style="display:none">
  <header>
    <div class="logo-container">
      <svg width="30" height="30" viewBox="0 0 100 100"><rect x="10" y="10" width="80" height="80" rx="20" stroke="#ff4d00" stroke-width="6" fill="none"/><rect x="35" y="32" width="10" height="10" fill="#ff4d00"/><rect x="35" y="45" width="10" height="10" fill="#ff4d00"/><rect x="35" y="58" width="10" height="10" fill="#ff4d00"/><rect x="48" y="38.5" width="10" height="10" fill="#ff4d00"/><rect x="48" y="51.5" width="10" height="10" fill="#ff4d00"/><rect x="61" y="45" width="10" height="10" fill="#ff4d00"/></svg>
      <div class="logo-text">Automata</div>
    </div>
    <div class="header-controls">
      <div class="filter-group">
        <div class="clear-extension" id="clearBtn" onclick="resetFiltersAndClose()">✕<span>Limpar Filtros</span></div>
        <div class="drop-wrapper">
          <button class="bubble-btn btn-canais" id="btnCanais" onclick="toggleDrop('dropCanais')">Canais ▾</button>
          <div class="drop-menu" id="dropCanais"></div>
        </div>
      </div>
      <div class="drop-wrapper">
        <button class="bubble-btn" id="btnPeriodo" onclick="toggleDrop('dropDatas')">28 Dias ▾</button>
        <div class="drop-menu" id="dropDatas">
          <div class="drop-opt" id="opt-1" onclick="setPreset(1)">Último Dia</div>
          <div class="drop-opt" id="opt-7" onclick="setPreset(7)">Últimos 7 Dias</div>
          <div class="drop-opt selected" id="opt-28" onclick="setPreset(28)">Últimos 28 Dias</div>
          <div class="drop-opt" id="opt-90" onclick="setPreset(90)">Últimos 90 Dias</div>
          <div id="monthOptions"></div>
        </div>
      </div>
      <button class="bubble-btn" onclick="toggleSidebar(true)">⋮</button>
    </div>
  </header>
  <div class="totals">
    <div class="total-card"><div class="label" id="labelRevenue">Receita Total</div><div class="value" id="totalRevenue">$0.00</div></div>
    <div class="total-card"><div class="label">Views Totais</div><div class="value" id="totalViews">0</div></div>
    <div class="total-card"><div class="label">RPM Médio</div><div class="value" id="totalRPM">$0.00</div></div>
  </div>
  <div class="chart-container"><canvas id="mainChart"></canvas></div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Canal</th><th>Receita</th><th>Views</th><th>RPM</th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<div class="sidebar" id="sidebar">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
    <h3 style="font-weight:800;letter-spacing:-0.5px">CONEXÕES</h3>
    <button class="bubble-btn" onclick="toggleSidebar(false)" style="border-color:var(--accent);color:var(--accent);padding:5px 12px">✕</button>
  </div>
  <div id="sidebarContent"></div>
</div>

<script>
const CHANNELS=[
  {id:'UC_RatoFIT',name:'RatoFIT'},{id:'UC_ZeroHora',name:'Zero Hora'},
  {id:'UC_VelozCuriosos',name:'Velozes & Curiosos'},{id:'UC_ComptonKings',name:'Compton Kings'},
  {id:'UC_Pixelando',name:'Pixelando 165'},{id:'UC_McQueeeen',name:'McQueeeen'},
  {id:'UC_RatoMaromba',name:'Rato Maromba'},{id:'UC_GroveStreet',name:'Grove Street Style'},
  {id:'UC_BerserkMode',name:'Berserk Mode'},{id:'UC_OnePunchFights',name:'One Punch Fights'},
  {id:'UC_UltimoPeao',name:'O Último Peão'},{id:'UC_EcosDaMente',name:'Ecos da Mente'}
];
const CHANNEL_IDS={
  'UC_RatoFIT':'UCR61DCrMZx-g3irgqgoT5JA','UC_ZeroHora':'UC6sh-Qiz2gj_uqUdYfYnX6w',
  'UC_VelozCuriosos':'UCXMwjsceXKA5dqbWSWE-_7Q','UC_ComptonKings':'UCGqLCGdh5xUJiQW416DQWjA',
  'UC_Pixelando':'UCzE6ujftVmVmEvGJW0MArlw','UC_McQueeeen':'UCMNvTCr-RwLVRW-jDIQVnBw',
  'UC_RatoMaromba':'UCxslmo0asWXgdWObPO8BFrQ','UC_GroveStreet':'UChQfM3wIfo84Ab0WeW9CwCA',
  'UC_BerserkMode':'UCzkne80zh104CdG3kDrTQ1w','UC_OnePunchFights':'UChdMYJwcBpizC4NLh5dRh4g',
  'UC_UltimoPeao':'UCkdnxxobb7NvO6EX2kLqv4A','UC_EcosDaMente':'UCpCEVQUoScH3SNPZjEcAWpg'
};

let accounts={},results={},thumbs={},activePeriod=28,myChart=null,cache={};
let selectedChannels=new Set(CHANNELS.map(c=>c.id));
let openDetailId=null,detailCharts={};

// Popup state
let popupChId='',popupType='',popupAllVideos=[],popupFilteredVideos=[];
let popupPage=0,popupPageSize=10;
let popupPages=[null]; // pageTokens: null = first page
let popupCurrentPageToken=null,popupNextToken=null,popupPrevToken=null,popupTotal=0;
let popupSearchMode=false;

// ── AUTH ──────────────────────────────────────────────────
async function login(){
  const pwd=document.getElementById('passwordInput').value;
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pwd})});
  if(r.ok){document.getElementById('authOverlay').classList.add('hidden');document.getElementById('appContent').style.display='block';initApp();}
}
async function initApp(){await loadAccounts();await loadThumbs();renderCanais();renderMeses();renderSidebar();initChart();fetchAll();}
async function loadAccounts(){try{const r=await fetch('/api/accounts');accounts=await r.json();}catch(e){}}
async function loadThumbs(){
  const ids=Object.values(CHANNEL_IDS).join(',');
  const r=await fetch('/api/channel-thumbs?ids='+ids);
  const data=await r.json();
  if(data.ok) Object.keys(CHANNEL_IDS).forEach(key=>{thumbs[key]=data.thumbs[CHANNEL_IDS[key]];});
}

// ── DROPDOWNS ─────────────────────────────────────────────
function toggleDrop(id){
  const el=document.getElementById(id);
  const isO=el.classList.contains('open');
  document.querySelectorAll('.drop-menu').forEach(d=>d.classList.remove('open'));
  if(!isO)el.classList.add('open');
  if(id==='dropCanais')renderCanais();
}
function resetFiltersAndClose(){
  selectedChannels=new Set(CHANNELS.map(c=>c.id));
  document.getElementById('dropCanais').classList.remove('open');
  renderCanais();updateUI();
}
function renderCanais(){
  const drop=document.getElementById('dropCanais');drop.innerHTML='';
  const allActive=selectedChannels.size===CHANNELS.length;
  const clearBtn=document.getElementById('clearBtn');
  if(!allActive)clearBtn.classList.add('active');else clearBtn.classList.remove('active');
  CHANNELS.forEach(ch=>{
    const isS=allActive?false:selectedChannels.has(ch.id);
    const div=document.createElement('div');div.className=`drop-opt ${isS?'selected':''}`;
    div.innerHTML=`<img src="${thumbs[ch.id]||''}" class="avatar"> <span>${ch.name}</span>`;
    div.onclick=(e)=>{
      e.stopPropagation();
      if(allActive){selectedChannels.clear();selectedChannels.add(ch.id);}
      else{if(selectedChannels.has(ch.id)){selectedChannels.delete(ch.id);if(selectedChannels.size===0)selectedChannels=new Set(CHANNELS.map(c=>c.id));}else{selectedChannels.add(ch.id);}}
      renderCanais();updateUI();
    };
    drop.appendChild(div);
  });
  const applyBtn=document.createElement('button');applyBtn.className='apply-filter-btn';applyBtn.innerText='Aplicar';
  applyBtn.onclick=()=>{document.getElementById('dropCanais').classList.remove('open');};
  drop.appendChild(applyBtn);
  document.getElementById('btnCanais').innerText=selectedChannels.size===CHANNELS.length?'Canais ▾':`${selectedChannels.size} Canais ▾`;
}
function renderMeses(){
  const monthNames=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  const container=document.getElementById('monthOptions');container.innerHTML='';
  const d=new Date();
  for(let i=0;i<3;i++){
    const m=new Date(d.getFullYear(),d.getMonth()-i,1);
    const opt=document.createElement('div');opt.className='drop-opt';opt.id='month-'+m.getMonth();opt.innerText=monthNames[m.getMonth()];
    opt.onclick=()=>{
      const first=new Date(m.getFullYear(),m.getMonth(),1).toISOString().split('T')[0];
      const last=new Date(m.getFullYear(),m.getMonth()+1,0).toISOString().split('T')[0];
      activePeriod='custom';highlightPeriod('month-'+m.getMonth());fetchAll(first,last);
      document.getElementById('btnPeriodo').innerText=monthNames[m.getMonth()]+' ▾';
    };
    container.appendChild(opt);
  }
}
function setPreset(days){activePeriod=days;highlightPeriod('opt-'+days);document.getElementById('btnPeriodo').innerText=(days===1?'Último Dia':days+' Dias')+' ▾';fetchAll();}
function highlightPeriod(id){document.querySelectorAll('.drop-menu .drop-opt').forEach(el=>el.classList.remove('selected'));const t=document.getElementById(id);if(t)t.classList.add('selected');}

// ── FETCH PRINCIPAL ───────────────────────────────────────
async function fetchAll(customS,customE){
  let start,end=new Date().toISOString().split('T')[0];
  if(customS){start=customS;end=customE;}
  else{const d=new Date();d.setDate(d.getDate()-(activePeriod===1?5:activePeriod));start=d.toISOString().split('T')[0];}
  const cacheKey=start+'_'+end;
  if(cache[cacheKey]){results=cache[cacheKey];updateUI();return;}
  const promises=CHANNELS.map(ch=>fetchChannel(ch,start,end));
  await Promise.all(promises);
  cache[cacheKey]=JSON.parse(JSON.stringify(results));
  updateUI();
}
async function fetchChannel(ch,start,end){try{const r=await fetch(`/api/analytics?channelId=${CHANNEL_IDS[ch.id]}&startDate=${start}&endDate=${end}`);const data=await r.json();results[ch.id]=data.ok?data.rows:[];}catch(e){results[ch.id]=[];}}

// ── UI PRINCIPAL ──────────────────────────────────────────
function updateUI(){
  const tbody=document.getElementById('tableBody');tbody.innerHTML='';
  openDetailId=null;
  let tR=0,tV=0,dD={},maxDate=null;
  if(activePeriod===1){
    let allDates=[];Object.values(results).forEach(rows=>rows.forEach(r=>{if(r[1]>0)allDates.push(r[0]);}));
    const ontem=new Date();ontem.setDate(ontem.getDate()-1);
    maxDate=allDates.length?allDates.sort().reverse()[0]:ontem.toISOString().split('T')[0];
    document.getElementById('labelRevenue').innerText='Receita ('+maxDate.split('-').reverse().join('/')+')';
  }else{document.getElementById('labelRevenue').innerText='Receita Total';}
  CHANNELS.forEach(ch=>{
    if(!selectedChannels.has(ch.id))return;
    let rows=results[ch.id]||[];
    if(activePeriod===1)rows=rows.filter(r=>r[0]===maxDate);
    const rS=rows.reduce((a,b)=>a+b[1],0);
    const vS=rows.reduce((a,b)=>a+b[2],0);
    const rpm=vS>0?(rS/vS)*1000:0;
    tR+=rS;tV+=vS;
    rows.forEach(r=>dD[r[0]]=(dD[r[0]]||0)+r[1]);
    tbody.innerHTML+=`
      <tr class="channel-row" onclick="toggleChannelDetail('${ch.id}',this)">
        <td><div class="row-chan"><img src="${thumbs[ch.id]}" class="avatar"><span>${ch.name}</span></div></td>
        <td style="color:var(--accent);font-weight:800">$${rS.toFixed(2)}</td>
        <td>${vS.toLocaleString()}</td>
        <td style="color:var(--muted)">$${rpm.toFixed(2)}</td>
      </tr>
      <tr class="channel-detail-row" id="detail-row-${ch.id}">
        <td colspan="4">
          <div class="channel-detail-inner" id="detail-inner-${ch.id}">
            <div class="channel-detail-content" id="detail-content-${ch.id}">
              <div class="detail-loading">Carregando...</div>
            </div>
          </div>
        </td>
      </tr>`;
  });
  document.getElementById('totalRevenue').innerText=`$${tR.toFixed(2)}`;
  document.getElementById('totalViews').innerText=tV.toLocaleString();
  document.getElementById('totalRPM').innerText=tV>0?`$${((tR/tV)*1000).toFixed(2)}`:'$0.00';
  updateChart(dD);
}

// ── ABA EXPANSÍVEL ────────────────────────────────────────
async function toggleChannelDetail(chId){
  const inner=document.getElementById(`detail-inner-${chId}`);
  if(!inner)return;
  if(openDetailId===chId){inner.classList.remove('open');openDetailId=null;return;}
  if(openDetailId){const prev=document.getElementById(`detail-inner-${openDetailId}`);if(prev)prev.classList.remove('open');}
  openDetailId=chId;
  inner.classList.add('open');
  const content=document.getElementById(`detail-content-${chId}`);
  if(content.querySelector('.detail-loading'))await loadChannelDetail(chId,content);
}

function getDetailPeriod(chId){
  const sel=detailCharts[chId]?.period||28;
  const end=new Date().toISOString().split('T')[0];
  const d=new Date();d.setDate(d.getDate()-sel);
  return{start:d.toISOString().split('T')[0],end};
}

async function loadChannelDetail(chId,content){
  const realId=CHANNEL_IDS[chId];
  if(!detailCharts[chId])detailCharts[chId]={period:28,rows:[],currentMetric:'views',chartInstance:null};
  const{start,end}=getDetailPeriod(chId);

  const[recentRes,topRes,detailRes]=await Promise.all([
    fetch(`/api/recent-videos?channelId=${realId}`).then(r=>r.json()).catch(()=>({ok:false,videos:[],nextPageToken:null,totalResults:0})),
    fetch(`/api/top-videos?channelId=${realId}&startDate=${start}&endDate=${end}`).then(r=>r.json()).catch(()=>({ok:false,videos:[]})),
    fetch(`/api/analytics-detail?channelId=${realId}&startDate=${start}&endDate=${end}`).then(r=>r.json()).catch(()=>({ok:false,rows:[]}))
  ]);

  detailCharts[chId].rows=detailRes.rows||[];
  detailCharts[chId].recentVideos=recentRes.videos||[];
  detailCharts[chId].recentNextToken=recentRes.nextPageToken||null;
  detailCharts[chId].recentTotal=recentRes.totalResults||0;
  detailCharts[chId].topVideos=topRes.videos||[];

  const curPeriod=detailCharts[chId].period;
  const periodLabels={7:'7 Dias',28:'28 Dias',90:'90 Dias'};

  content.innerHTML=`
    <div class="detail-block">
      <div class="detail-block-header">
        <h4>Últimos Vídeos</h4>
      </div>
      <div class="video-list" id="recent-grid-${chId}">${renderVideoCards(detailCharts[chId].recentVideos.slice(0,4),true)}</div>
      <button class="expand-btn" onclick="openPopup('recent','${chId}')">Ver todos ${detailCharts[chId].recentTotal>0?'(~'+detailCharts[chId].recentTotal+')':''} ▾</button>
    </div>
    <div class="detail-block">
      <div class="detail-block-header">
        <h4>Melhor Performance</h4>
      </div>
      <div class="video-list" id="top-grid-${chId}">${renderVideoCards(detailCharts[chId].topVideos.slice(0,4),false,true)}</div>
      ${detailCharts[chId].topVideos.length>4?`<button class="expand-btn" onclick="openPopup('top','${chId}')">Ver todos ▾</button>`:''}
    </div>
    <div class="detail-block">
      <div class="detail-chart-top">
        <h4 style="font-size:0.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700">Desempenho</h4>
        <div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap">
          <div class="chart-filter-btns">
            <button class="chart-filter-btn active" onclick="switchDetailChart('${chId}','views',this)">Views</button>
            <button class="chart-filter-btn" onclick="switchDetailChart('${chId}','minutes',this)">Min.</button>
            <button class="chart-filter-btn" onclick="switchDetailChart('${chId}','revenue',this)">Receita</button>
          </div>
          <div class="period-select-wrap">
            <button class="period-select-btn" onclick="togglePeriodDrop('${chId}',event)">${periodLabels[curPeriod]||'28 Dias'} ▾</button>
            <div class="period-drop" id="period-drop-${chId}">
              <div class="period-opt ${curPeriod===7?'selected':''}" onclick="setDetailPeriod('${chId}',7)">7 Dias</div>
              <div class="period-opt ${curPeriod===28?'selected':''}" onclick="setDetailPeriod('${chId}',28)">28 Dias</div>
              <div class="period-opt ${curPeriod===90?'selected':''}" onclick="setDetailPeriod('${chId}',90)">90 Dias</div>
            </div>
          </div>
        </div>
      </div>
      <div class="detail-chart-container"><canvas id="detail-chart-${chId}"></canvas></div>
    </div>`;

  initDetailChart(chId,detailCharts[chId].rows,'views');
}

// SVG icons
const IC={
  cal:`<svg viewBox="0 0 16 16"><path d="M4 1v1H2a1 1 0 00-1 1v11a1 1 0 001 1h12a1 1 0 001-1V3a1 1 0 00-1-1h-2V1h-1v1H5V1H4zm-2 4h12v8H2V5z"/></svg>`,
  eye:`<svg viewBox="0 0 16 16"><path d="M8 3C4 3 1 8 1 8s3 5 7 5 7-5 7-5-3-5-7-5zm0 8a3 3 0 110-6 3 3 0 010 6z"/></svg>`,
  like:`<svg viewBox="0 0 16 16"><path d="M1 9l2-5h2V3a1 1 0 012 0v1h6l1 1v5l-1 1H7v2H5V9H1z"/></svg>`,
  comment:`<svg viewBox="0 0 16 16"><path d="M2 2h12a1 1 0 011 1v8a1 1 0 01-1 1H5l-3 3V3a1 1 0 011-1z"/></svg>`,
  dollar:`<svg viewBox="0 0 16 16"><path d="M8 1v1.5C5.5 2.8 4 4 4 5.5c0 2 2 3 4 3.5 1.5.4 2 1 2 1.5 0 .8-1 1.5-2 1.5-1.5 0-2.5-.7-2.5-1.5H4c0 1.5 1.5 2.7 4 3V15h1v-1.5c2.5-.3 4-1.5 4-3s-1.5-2.7-4-3.2C7.5 6.9 7 6.3 7 5.5c0-.8.8-1.5 2-1.5s2 .7 2 1.5h1.5C12.5 4 11 2.8 9 2.5V1H8z"/></svg>`
};

function fmtNum(n){if(!n&&n!==0)return'—';if(n>=1000000)return(n/1000000).toFixed(1)+'M';if(n>=1000)return(n/1000).toFixed(1)+'k';return n.toLocaleString();}
function fmtDate(d){if(!d)return'—';return new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});}

function renderVideoCards(videos,isRecent=false,isTop=false){
  if(!videos||!videos.length)return'<div style="color:var(--muted);font-size:0.72rem;padding:8px">Nenhum vídeo</div>';
  return videos.map((v,i)=>{
    const isLatest=isRecent&&i===0;
    const revenue=isTop&&v.revenue!=null?`<span class="video-icon">${IC.dollar}<span>$${Number(v.revenue).toFixed(2)}</span></span>`:'';
    return`<div class="video-card ${isLatest?'latest':''}" onclick="window.open('https://youtube.com/watch?v=${v.id}','_blank')">
      <img class="video-card-thumb" src="${v.thumb||''}" loading="lazy">
      <div class="video-card-body">
        ${isLatest?'<div class="video-card-badge">NOVO</div>':''}
        <div class="video-card-title">${v.title||'Sem título'}</div>
        <div class="video-card-icons">
          <span class="video-icon">${IC.cal}<span>${fmtDate(v.publishedAt)}</span></span>
          <span class="video-icon">${IC.eye}<span>${fmtNum(v.views||0)}</span></span>
          <span class="video-icon">${IC.like}<span>${fmtNum(v.likes||0)}</span></span>
          <span class="video-icon">${IC.comment}<span>${fmtNum(v.comments||0)}</span></span>
          ${revenue}
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── GRÁFICO DETALHE ───────────────────────────────────────
function initDetailChart(chId,rows,metric){
  const ctx=document.getElementById(`detail-chart-${chId}`);
  if(!ctx)return;
  if(detailCharts[chId]?.chartInstance)detailCharts[chId].chartInstance.destroy();
  const idx={views:1,minutes:2,revenue:3}[metric];
  const labels=rows.map(r=>r[0].split('-').reverse().slice(0,2).join('/'));
  const data=rows.map(r=>r[idx]||0);
  const chart=new Chart(ctx,{
    type:'line',
    data:{labels,datasets:[{
      label:metric,data,
      borderColor:'#ff4d00',tension:0.45,fill:true,
      backgroundColor:(ctx2=>{
        const g=ctx2.chart.ctx.createLinearGradient(0,0,0,ctx2.chart.height);
        g.addColorStop(0,'rgba(255,77,0,0.25)');g.addColorStop(1,'rgba(255,77,0,0)');return g;
      }),
      borderWidth:2,pointRadius:0,pointHoverRadius:4,pointHoverBackgroundColor:'#ff4d00'
    }]},
    options:{
      responsive:true,maintainAspectRatio:false,
      layout:{padding:{top:4,bottom:0,left:0,right:0}},
      plugins:{legend:{display:false},tooltip:{
        mode:'index',intersect:false,
        backgroundColor:'rgba(10,10,10,0.9)',borderColor:'#1a1a1a',borderWidth:1,
        titleColor:'#888',titleFont:{size:10},bodyColor:'#fff',bodyFont:{size:11,weight:'700'},
        padding:8,displayColors:false
      }},
      scales:{
        y:{
          grid:{color:'rgba(255,255,255,0.04)',drawBorder:false},
          border:{display:false},
          ticks:{color:'#444',font:{size:9},maxTicksLimit:4,callback:v=>v>=1000?(v/1000).toFixed(0)+'k':v}
        },
        x:{
          grid:{display:false},border:{display:false},
          ticks:{color:'#444',font:{size:9},maxTicksLimit:6,maxRotation:0}
        }
      }
    }
  });
  detailCharts[chId].chartInstance=chart;
  detailCharts[chId].currentMetric=metric;
}

function switchDetailChart(chId,metric,btn){
  document.querySelectorAll(`#detail-content-${chId} .chart-filter-btn`).forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  initDetailChart(chId,detailCharts[chId]?.rows||[],metric);
}
function togglePeriodDrop(chId,e){
  e.stopPropagation();
  const drop=document.getElementById(`period-drop-${chId}`);
  const isOpen=drop.classList.contains('open');
  document.querySelectorAll('.period-drop').forEach(d=>d.classList.remove('open'));
  if(!isOpen)drop.classList.add('open');
}
async function setDetailPeriod(chId,period){
  detailCharts[chId].period=period;
  document.getElementById(`period-drop-${chId}`).classList.remove('open');
  const btn=document.querySelector(`#detail-content-${chId} .period-select-btn`);
  if(btn)btn.textContent={7:'7 Dias',28:'28 Dias',90:'90 Dias'}[period]+' ▾';
  document.querySelectorAll(`#period-drop-${chId} .period-opt`).forEach(o=>o.classList.remove('selected'));
  document.querySelectorAll(`#period-drop-${chId} .period-opt`).forEach(o=>{if(o.textContent.trim().startsWith(String(period)))o.classList.add('selected');});
  const realId=CHANNEL_IDS[chId];
  const{start,end}=getDetailPeriod(chId);
  const[topRes,detailRes]=await Promise.all([
    fetch(`/api/top-videos?channelId=${realId}&startDate=${start}&endDate=${end}`).then(r=>r.json()).catch(()=>({ok:false,videos:[]})),
    fetch(`/api/analytics-detail?channelId=${realId}&startDate=${start}&endDate=${end}`).then(r=>r.json()).catch(()=>({ok:false,rows:[]}))
  ]);
  detailCharts[chId].rows=detailRes.rows||[];
  detailCharts[chId].topVideos=topRes.videos||[];
  const topGrid=document.getElementById(`top-grid-${chId}`);
  if(topGrid)topGrid.innerHTML=renderVideoCards(detailCharts[chId].topVideos.slice(0,4),false,true);
  initDetailChart(chId,detailCharts[chId].rows,detailCharts[chId].currentMetric||'views');
}

// ── POPUP ─────────────────────────────────────────────────
async function openPopup(type,chId){
  popupType=type;popupChId=chId;
  popupPage=0;popupPages=[null];popupSearchMode=false;
  popupAllVideos=[];popupFilteredVideos=[];
  document.getElementById('popupSearch').value='';
  document.getElementById('popupTitle').textContent=type==='recent'?'Últimos Vídeos':'Melhor Performance';
  resetPopupDetail();
  document.getElementById('popupOverlay').classList.add('open');
  document.body.classList.add('no-scroll');
  await loadPopupPage(null);
}

async function loadPopupPage(pageToken){
  const realId=CHANNEL_IDS[popupChId];
  document.getElementById('popupVideoList').innerHTML='<div style="padding:20px;text-align:center;color:var(--muted);font-size:0.78rem">Carregando...</div>';
  if(popupType==='recent'){
    let url=`/api/recent-videos?channelId=${realId}`;
    if(pageToken)url+=`&pageToken=${encodeURIComponent(pageToken)}`;
    const data=await fetch(url).then(r=>r.json()).catch(()=>({ok:false,videos:[]}));
    popupAllVideos=data.videos||[];
    popupNextToken=data.nextPageToken||null;
    popupPrevToken=data.prevPageToken||null;
    popupTotal=data.totalResults||0;
  } else {
    popupAllVideos=detailCharts[popupChId]?.topVideos||[];
    popupNextToken=null;popupPrevToken=null;
    popupTotal=popupAllVideos.length;
  }
  popupFilteredVideos=popupAllVideos;
  renderPopupList();
  updatePopupNav();
}

function filterPopupVideos(){
  const q=document.getElementById('popupSearch').value.toLowerCase().trim();
  if(!q){popupFilteredVideos=popupAllVideos;popupSearchMode=false;}
  else{popupFilteredVideos=popupAllVideos.filter(v=>(v.title||'').toLowerCase().includes(q));popupSearchMode=true;}
  renderPopupList();
  updatePopupNav();
}

function renderPopupList(){
  const list=document.getElementById('popupVideoList');
  if(!popupFilteredVideos.length){list.innerHTML='<div style="padding:20px;text-align:center;color:var(--muted);font-size:0.78rem">Nenhum vídeo encontrado</div>';return;}
  // Mostra 10 por vez com scroll — todos ficam no DOM mas controlados via slice na busca
  list.innerHTML=popupFilteredVideos.map((v,i)=>{
    const isTop=popupType==='top';
    const meta=isTop?`${fmtNum(v.views||0)} views`:fmtDate(v.publishedAt);
    return`<div class="popup-video-item" onclick="selectPopupVideo(${i},this)">
      <img class="pv-thumb" src="${v.thumb||''}" loading="lazy">
      <div class="pv-info">
        <div class="pv-title">${v.title||'Sem título'}</div>
        <div class="pv-meta">${meta}</div>
      </div>
    </div>`;
  }).join('');
}

async function popupGoPage(dir){
  if(popupSearchMode)return;
  const curIdx=popupPages.indexOf(popupCurrentPageToken);
  if(dir==='first'){
    popupCurrentPageToken=null;popupPage=0;
    await loadPopupPage(null);
  } else if(dir==='prev'){
    if(curIdx>0){popupCurrentPageToken=popupPages[curIdx-1];popupPage=curIdx-1;await loadPopupPage(popupCurrentPageToken);}
  } else if(dir==='next'){
    if(popupNextToken){
      if(curIdx===popupPages.length-1)popupPages.push(popupNextToken);
      popupCurrentPageToken=popupNextToken;popupPage=curIdx+1;
      await loadPopupPage(popupCurrentPageToken);
    }
  } else if(dir==='last'){
    // Avança até não ter mais próxima página
    let token=popupNextToken;
    while(token){
      const realId=CHANNEL_IDS[popupChId];
      const data=await fetch(`/api/recent-videos?channelId=${realId}&pageToken=${encodeURIComponent(token)}`).then(r=>r.json()).catch(()=>({videos:[],nextPageToken:null}));
      popupAllVideos=data.videos||[];
      popupFilteredVideos=popupAllVideos;
      popupPages.push(token);
      popupCurrentPageToken=token;
      token=data.nextPageToken||null;
      popupNextToken=token;
      popupPrevToken=popupPages[popupPages.length-2]||null;
      popupPage=popupPages.length-1;
    }
    renderPopupList();
    updatePopupNav();
  }
}

function updatePopupNav(){
  const total=popupTotal>0?`~${popupTotal} vídeos`:'';
  document.getElementById('popupTotal').textContent=total;
  const info=popupNextToken||popupPrevToken?`Pág ${popupPage+1}`:'';
  document.getElementById('popupNavInfo').textContent=info;
  document.getElementById('popupNavInfoB').textContent=info;
  const hasPrev=!!popupPrevToken||popupPage>0;
  const hasNext=!!popupNextToken;
  ['navFirst','navPrev'].forEach(id=>{const el=document.getElementById(id);if(el)el.disabled=!hasPrev;});
  ['navNext','navPrevB'].forEach(id=>{const el=document.getElementById(id);if(el)el.disabled=!hasNext;});
  document.getElementById('navNextB').disabled=!hasNext;
  // Oculta nav se tipo top (não tem paginação)
  const showNav=popupType==='recent'&&(popupNextToken||popupPage>0);
  document.getElementById('popupNavTop').style.opacity=showNav?'1':'0.3';
}

async function selectPopupVideo(idx,el){
  document.querySelectorAll('.popup-video-item').forEach(i=>i.classList.remove('active'));
  el.classList.add('active');
  const video=popupFilteredVideos[idx];
  if(!video)return;
  const panel=document.getElementById('popupDetailPanel');
  const empty=document.getElementById('popupDetailEmpty');
  const content=document.getElementById('popupDetailContent');
  empty.style.display='none';
  content.style.display='block';
  content.innerHTML='<div class="metrics-loading">Carregando métricas...</div>';
  panel.classList.add('visible');
  const{start,end}=getDetailPeriod(popupChId);
  try{
    const r=await fetch(`/api/video-metrics?videoId=${video.id}&channelId=${CHANNEL_IDS[popupChId]}&startDate=${start}&endDate=${end}`);
    const data=await r.json();
    const date=video.publishedAt?new Date(video.publishedAt).toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'}):'';
    content.innerHTML=`
      <div class="popup-video-preview">
        <img src="${video.thumb||''}" loading="lazy">
        <div>
          <div class="popup-video-preview-title">${video.title||'Sem título'}</div>
          <div class="popup-video-preview-date">${date}</div>
          <a href="https://youtube.com/watch?v=${video.id}" target="_blank" style="font-size:0.68rem;color:var(--accent);text-decoration:none;margin-top:5px;display:inline-block">Abrir no YouTube ↗</a>
        </div>
      </div>
      <div class="metrics-grid">
        <div class="metric-card"><div class="m-label">Views</div><div class="m-value">${(data.views||0).toLocaleString()}</div></div>
        <div class="metric-card"><div class="m-label">Receita Est.</div><div class="m-value">$${(data.revenue||0).toFixed(2)}</div></div>
        <div class="metric-card"><div class="m-label">Taxa de Likes</div><div class="m-value">${data.likeRate||'—'}</div><div class="m-sub">por 1.000 views</div></div>
        <div class="metric-card"><div class="m-label">Comentários</div><div class="m-value">${(data.comments||0).toLocaleString()}</div></div>
        <div class="metric-card"><div class="m-label">Retenção Média</div><div class="m-value">${data.retention||'—'}</div><div class="m-sub">% assistido</div></div>
        <div class="metric-card"><div class="m-label">Min. Assistidos</div><div class="m-value">${fmtNum(data.minutes||0)}</div></div>
      </div>`;
  }catch(e){content.innerHTML='<div class="metrics-loading">Erro ao carregar</div>';}
}

function resetPopupDetail(){
  document.getElementById('popupDetailEmpty').style.display='flex';
  document.getElementById('popupDetailContent').style.display='none';
  document.getElementById('popupDetailPanel').classList.remove('visible');
}

function closePopup(){
  document.getElementById('popupOverlay').classList.remove('open');
  document.body.classList.remove('no-scroll');
}
function handlePopupOverlayClick(e){if(e.target===document.getElementById('popupOverlay'))closePopup();}

// ── SIDEBAR & CHARTS ──────────────────────────────────────
function toggleSidebar(open){
  const s=document.getElementById('sidebar'),o=document.getElementById('sidebarOverlay');
  if(open){s.classList.add('open');o.classList.add('active');document.body.classList.add('no-scroll');}
  else{s.classList.remove('open');o.classList.remove('active');document.body.classList.remove('no-scroll');}
}
function renderSidebar(){
  const content=document.getElementById('sidebarContent');content.innerHTML='';
  CHANNELS.forEach(ch=>{
    const isC=!!accounts[ch.id];
    const card=document.createElement('div');card.className='side-card';
    card.onclick=()=>{if(!isC)window.location.href=`/auth/${ch.id}`;};
    card.innerHTML=`<div style="display:flex;align-items:center;gap:12px"><img src="${thumbs[ch.id]}" class="avatar"><div><b>${ch.name}</b></div></div><div class="status-ball ${isC?'active':''}"></div>`;
    content.appendChild(card);
  });
}

function initChart(){
  const ctx=document.getElementById('mainChart').getContext('2d');
  myChart=new Chart(ctx,{
    type:'line',
    data:{labels:[],datasets:[{
      label:'Receita',data:[],
      borderColor:'#ff4d00',tension:0.45,fill:true,
      backgroundColor:(ctx2=>{
        const g=ctx2.chart.ctx.createLinearGradient(0,0,0,ctx2.chart.height);
        g.addColorStop(0,'rgba(255,77,0,0.3)');g.addColorStop(1,'rgba(255,77,0,0)');return g;
      }),
      borderWidth:2.5,pointRadius:0,pointHoverRadius:5,pointHoverBackgroundColor:'#ff4d00'
    }]},
    options:{
      responsive:true,maintainAspectRatio:false,
      layout:{padding:{top:6,bottom:0}},
      plugins:{legend:{display:false},tooltip:{
        mode:'index',intersect:false,
        backgroundColor:'rgba(8,8,8,0.92)',borderColor:'#222',borderWidth:1,
        titleColor:'#666',titleFont:{size:10},bodyColor:'#fff',bodyFont:{size:12,weight:'700'},
        padding:10,displayColors:false
      }},
      scales:{
        y:{
          grid:{color:'rgba(255,255,255,0.03)',drawBorder:false},
          border:{display:false},
          ticks:{color:'#333',font:{size:10},maxTicksLimit:5,callback:v=>v>=1000?'$'+(v/1000).toFixed(0)+'k':'$'+v}
        },
        x:{
          grid:{display:false},border:{display:false},
          ticks:{color:'#333',font:{size:10},maxTicksLimit:8,maxRotation:0}
        }
      }
    }
  });
}

function updateChart(dailyData){
  const sorted=Object.keys(dailyData).sort();
  myChart.data.labels=sorted.map(d=>{const p=d.split('-');return p[2]+'/'+p[1];});
  myChart.data.datasets[0].data=sorted.map(d=>dailyData[d]);
  myChart.update();
}

document.addEventListener('click',(e)=>{
  if(!e.target.closest('.drop-wrapper')&&!e.target.closest('.filter-group')&&!e.target.closest('.drop-menu'))
    document.querySelectorAll('.drop-menu').forEach(d=>d.classList.remove('open'));
  if(!e.target.closest('.period-select-wrap'))
    document.querySelectorAll('.period-drop').forEach(d=>d.classList.remove('open'));
});
</script>
