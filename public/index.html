<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard YT Shorts</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #222222;
    --accent: #ff4d00;
    --accent2: #ffcc00;
    --text: #f0f0f0;
    --muted: #555;
    --green: #00e676;
    --red: #ff1744;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 32px 24px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 40px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
  }

  .logo {
    font-size: 1.4rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .logo span { color: var(--accent); }

  .period-selector {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .period-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    transition: all 0.15s;
  }

  .period-btn:hover, .period-btn.active {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Contas */
  .accounts-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }

  .account-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 16px;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 0.85rem;
  }

  .account-chip:hover { border-color: var(--accent); }
  .account-chip.connected { border-color: var(--green); }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
  }

  .account-chip.connected .dot { background: var(--green); }

  .btn-fetch {
    margin-left: auto;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 24px;
    border-radius: 6px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .btn-fetch:hover { opacity: 0.85; }
  .btn-fetch:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Totais */
  .totals {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }

  .total-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 24px;
  }

  .total-card .label {
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-family: 'Space Mono', monospace;
    margin-bottom: 8px;
  }

  .total-card .value {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.03em;
  }

  .total-card.revenue .value { color: var(--accent2); }
  .total-card.views .value { color: var(--text); }

  /* Tabela */
  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    background: #161616;
    padding: 12px 20px;
    text-align: left;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    border-bottom: 1px solid var(--border);
  }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }

  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #161616; }

  td {
    padding: 14px 20px;
    font-size: 0.9rem;
  }

  td.channel-name { font-weight: 700; }

  td.revenue {
    font-family: 'Space Mono', monospace;
    color: var(--accent2);
    font-size: 0.85rem;
  }

  td.views {
    font-family: 'Space Mono', monospace;
    color: var(--muted);
    font-size: 0.85rem;
  }

  td.status {
    font-size: 0.75rem;
    font-family: 'Space Mono', monospace;
  }

  .badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 3px;
    font-size: 0.7rem;
  }

  .badge.ok { background: rgba(0,230,118,0.1); color: var(--green); }
  .badge.error { background: rgba(255,23,68,0.1); color: var(--red); }
  .badge.pending { background: rgba(255,255,255,0.05); color: var(--muted); }
  .badge.loading { background: rgba(255,204,0,0.1); color: var(--accent2); }

  .modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }

  .modal-bg.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 32px;
    width: 440px;
    max-width: 95vw;
  }

  .modal h3 { margin-bottom: 8px; font-size: 1.1rem; }
  .modal p { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; line-height: 1.5; }

  .modal-actions { display: flex; gap: 10px; }

  .btn-secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Syne', sans-serif;
    font-size: 0.9rem;
  }

  .btn-primary {
    background: var(--accent);
    border: none;
    color: #fff;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    text-decoration: none;
    display: inline-block;
  }

  .status-msg {
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 16px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">YT<span>.</span>Dashboard</div>
  <div class="period-selector">
    <button class="period-btn active" data-days="7">7d</button>
    <button class="period-btn" data-days="30">30d</button>
    <button class="period-btn" data-days="90">90d</button>
  </div>
</header>

<div class="accounts-bar" id="accountsBar">
  <!-- gerado pelo JS -->
  <button class="btn-fetch" id="btnFetch" onclick="fetchAll()">▶ Buscar Dados</button>
</div>

<div class="totals">
  <div class="total-card revenue">
    <div class="label">Receita Total</div>
    <div class="value" id="totalRevenue">—</div>
  </div>
  <div class="total-card views">
    <div class="label">Views Totais</div>
    <div class="value" id="totalViews">—</div>
  </div>
</div>

<p class="status-msg" id="statusMsg">Conecte as contas e clique em Buscar Dados.</p>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Canal</th>
        <th>Receita (USD)</th>
        <th>Views</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <!-- linhas geradas pelo JS -->
    </tbody>
  </table>
</div>

<!-- Modal de login -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">Conectar Conta</h3>
    <p id="modalDesc">Você será redirecionado para o login do Google. Selecione a conta correta e autorize o acesso.</p>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <a class="btn-primary" id="modalLink" href="#">Conectar →</a>
    </div>
  </div>
</div>

<script>
// ── CANAIS ────────────────────────────────────────────────
const CHANNELS = [
  { id: 'UC_RatoFIT',          name: 'RatoFIT',             account: 1 },
  { id: 'UC_ZeroHora',         name: 'Zero Hora',           account: 1 },
  { id: 'UC_VelozCuriosos',    name: 'Velozes & Curiosos',  account: 1 },
  { id: 'UC_ComptonKings',     name: 'Compton Kings',       account: 1 },
  { id: 'UC_Pixelando',        name: 'Pixelando 165',       account: 2 },
  { id: 'UC_McQueeeen',        name: 'McQueeeen',           account: 2 },
  { id: 'UC_RatoMaromba',      name: 'Rato Maromba',        account: 2 },
  { id: 'UC_GroveStreet',      name: 'Grove Street Style',  account: 2 },
  { id: 'UC_BerserkMode',      name: 'Berserk Mode',        account: 2 },
  { id: 'UC_OnePunchFights',   name: 'One Punch Fights',    account: 3 },
  { id: 'UC_UltimoPeao',       name: 'O Último Peão',       account: 3 },
  { id: 'UC_EcosDaMente',      name: 'Ecos da Mente',       account: 3 },
];

// IDs reais dos canais — precisam ser preenchidos
// Formato: UC + 22 caracteres. Encontre em: YouTube Studio > Configurações > Informações do Canal
const CHANNEL_IDS = {
  'UC_RatoFIT':        'UCR61DCrMZx-g3irgqgoT5JA',
  'UC_ZeroHora':       'UC6sh-Qiz2gj_uqUdYfYnX6w',
  'UC_VelozCuriosos':  'UCXMwjsceXKA5dqbWSWE-_7Q',
  'UC_ComptonKings':   'UCGqLCGdh5xUJiQW416DQWjA',
  'UC_Pixelando':      'UCzE6ujftVmVmEvGJW0MArlw',
  'UC_McQueeeen':      'UCMNvTCr-RwLVRW-jDIQVnBw',
  'UC_RatoMaromba':    'UCxslmo0asWXgdWObPO8BFrQ',
  'UC_GroveStreet':    'UChQfM3wIfo84Ab0WeW9CwCA',
  'UC_BerserkMode':    'UCzkne80zh104CdG3kDrTQ1w',
  'UC_OnePunchFights': 'UChdMYJwcBpizC4NLh5dRh4g',
  'UC_UltimoPeao':     'UCkdnxxobb7NvO6EX2kLqv4A',
  'UC_EcosDaMente':    'UCpCEVQUoScH3SNPZjEcAWpg',
};

// ── STATE ─────────────────────────────────────────────────
let accounts = {};
let results = {};
let activeDays = 7;

// ── INIT ──────────────────────────────────────────────────
async function init() {
  await loadAccounts();
  renderAccountsBar();
  renderTable();
  checkConnectedParam();
}

async function loadAccounts() {
  try {
    const r = await fetch('/api/accounts');
    accounts = await r.json();
  } catch { accounts = {}; }
}

function checkConnectedParam() {
  const params = new URLSearchParams(location.search);
  if (params.get('connected')) {
    history.replaceState({}, '', '/');
    setStatus('Conta conectada com sucesso!');
  }
  if (params.get('error')) {
    history.replaceState({}, '', '/');
    setStatus('Erro ao conectar: ' + params.get('error'));
  }
}

// ── RENDER ACCOUNTS ───────────────────────────────────────
function renderAccountsBar() {
  const bar = document.getElementById('accountsBar');
  const btn = document.getElementById('btnFetch');
  bar.innerHTML = '';

  const accountLabels = {
    1: 'vini.shortformteam',
    2: 'apenasfischer',
    3: 'fischerviniciuus2',
  };

  [1, 2, 3].forEach(slot => {
    const connected = !!accounts[slot];
    const chip = document.createElement('div');
    chip.className = 'account-chip' + (connected ? ' connected' : '');
    chip.innerHTML = `<div class="dot"></div><span>${accountLabels[slot]}</span>`;
    chip.onclick = () => openModal(slot, accountLabels[slot], connected);
    bar.appendChild(chip);
  });

  bar.appendChild(btn);
}

// ── MODAL ─────────────────────────────────────────────────
function openModal(slot, label, connected) {
  document.getElementById('modalTitle').textContent = connected ? `Reconectar ${label}` : `Conectar ${label}`;
  document.getElementById('modalDesc').textContent = connected
    ? `Esta conta já está conectada. Clique para reconectar e atualizar o acesso.`
    : `Você será redirecionado para o login do Google. Selecione a conta ${label}@gmail.com e autorize o acesso.`;
  document.getElementById('modalLink').href = `/auth/${slot}`;
  document.getElementById('modalBg').classList.add('open');
}

function closeModal() {
  document.getElementById('modalBg').classList.remove('open');
}

// ── PERIOD ────────────────────────────────────────────────
document.querySelectorAll('.period-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeDays = parseInt(btn.dataset.days);
  };
});

// ── FETCH ALL ─────────────────────────────────────────────
async function fetchAll() {
  const connectedSlots = Object.keys(accounts);
  if (!connectedSlots.length) {
    setStatus('Conecte pelo menos uma conta primeiro.');
    return;
  }

  document.getElementById('btnFetch').disabled = true;
  results = {};
  renderTable();

  const endDate = new Date().toISOString().split('T')[0];
  const startDate = new Date(Date.now() - activeDays * 86400000).toISOString().split('T')[0];
  setStatus(`Buscando dados de ${startDate} até ${endDate}...`);

  const promises = CHANNELS.map(ch => fetchChannel(ch, startDate, endDate));
  await Promise.all(promises);

  renderTable();
  renderTotals();
  setStatus(`Dados atualizados — ${new Date().toLocaleTimeString('pt-BR')}`);
  document.getElementById('btnFetch').disabled = false;
}

async function fetchChannel(ch, startDate, endDate) {
  const realId = CHANNEL_IDS[ch.id];
  if (!realId || realId === 'COLE_ID_AQUI') {
    results[ch.id] = { status: 'no_id' };
    renderRow(ch);
    return;
  }

  results[ch.id] = { status: 'loading' };
  renderRow(ch);

  try {
    const r = await fetch(`/api/analytics?channelId=${realId}&startDate=${startDate}&endDate=${endDate}`);
    const data = await r.json();
    results[ch.id] = data.ok
      ? { status: 'ok', receita: data.receita, views: data.views }
      : { status: 'error' };
  } catch {
    results[ch.id] = { status: 'error' };
  }

  renderRow(ch);
}

// ── RENDER TABLE ──────────────────────────────────────────
function renderTable() {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  CHANNELS.forEach((ch, i) => renderRow(ch, i + 1));
}

function renderRow(ch, idx) {
  const tbody = document.getElementById('tableBody');
  const existingRow = document.getElementById('row-' + ch.id);
  const r = results[ch.id];

  let revenueCell = '<td class="revenue">—</td>';
  let viewsCell = '<td class="views">—</td>';
  let badge = '<span class="badge pending">aguardando</span>';

  if (r) {
    if (r.status === 'loading') badge = '<span class="badge loading">buscando...</span>';
    else if (r.status === 'ok') {
      badge = '<span class="badge ok">ok</span>';
      revenueCell = `<td class="revenue">$${r.receita.toFixed(2)}</td>`;
      viewsCell = `<td class="views">${r.views.toLocaleString('pt-BR')}</td>`;
    } else if (r.status === 'error') badge = '<span class="badge error">sem acesso</span>';
    else if (r.status === 'no_id') badge = '<span class="badge error">ID faltando</span>';
  }

  const rowIdx = CHANNELS.indexOf(ch) + 1;
  const html = `
    <tr id="row-${ch.id}">
      <td class="views">${rowIdx}</td>
      <td class="channel-name">${ch.name}</td>
      ${revenueCell}
      ${viewsCell}
      <td class="status">${badge}</td>
    </tr>`;

  if (existingRow) {
    existingRow.outerHTML = html;
  } else {
    tbody.insertAdjacentHTML('beforeend', html);
  }
}

function renderTotals() {
  let totalRev = 0, totalViews = 0;
  Object.values(results).forEach(r => {
    if (r.status === 'ok') {
      totalRev += r.receita;
      totalViews += r.views;
    }
  });
  document.getElementById('totalRevenue').textContent = '$' + totalRev.toFixed(2);
  document.getElementById('totalViews').textContent = totalViews.toLocaleString('pt-BR');
}

function setStatus(msg) {
  document.getElementById('statusMsg').textContent = msg;
}

init();
</script>
</body>
</html>
